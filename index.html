<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WaveCombat Hub</title>
    <link rel="manifest" href="manifest.json">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        :root {
            --bg-color: #0b0f19;
            --card-bg: #131b2e;
            --accent-color: #00e5ff;
            --text-color: #ffffff;
            --subtext-color: #94a3b8;
            --border-color: rgba(255, 255, 255, 0.08);
        }

        body {
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
        }

        header {
            width: 100%;
            max-width: 800px;
            padding: 15px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            box-sizing: border-box;
            background: rgba(19, 27, 46, 0.9);
            backdrop-filter: blur(10px);
            position: sticky;
            top: 0;
            z-index: 100;
            border-bottom: 1px solid var(--border-color);
        }

        .user-status {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .status-dot {
            width: 10px;
            height: 10px;
            border-radius: 50%;
            background-color: #10b981;
            box-shadow: 0 0 8px #10b981;
        }

        .container {
            width: 100%;
            max-width: 800px;
            padding: 15px;
            box-sizing: border-box;
            display: flex;
            flex-direction: column;
            gap: 20px;
            margin-bottom: 40px;
        }

        .card {
            background-color: var(--card-bg);
            border-radius: 12px;
            padding: 18px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.4);
            border: 1px solid var(--border-color);
        }

        .card h3 {
            margin-top: 0;
            color: var(--accent-color);
            font-size: 1.15em;
            border-bottom: 1px solid var(--border-color);
            padding-bottom: 8px;
        }

        /* Diamantes & Perfil */
        .wallet-banner {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: rgba(0, 229, 255, 0.05);
            padding: 10px 15px;
            border-radius: 8px;
            border: 1px solid rgba(0, 229, 255, 0.2);
            margin-bottom: 12px;
        }

        .level-badge {
            background: #3b82f6;
            color: #fff;
            padding: 3px 10px;
            border-radius: 12px;
            font-size: 0.8em;
            font-weight: bold;
        }

        .color-picker-box {
            display: flex;
            gap: 15px;
            align-items: center;
            font-size: 0.9em;
        }

        .color-picker-box input[type="color"] {
            border: none;
            width: 35px;
            height: 35px;
            border-radius: 6px;
            cursor: pointer;
            background: none;
        }

        /* Busca de Jogos & Lista */
        .search-box {
            width: 100%;
            padding: 12px 15px;
            border-radius: 8px;
            border: 1px solid var(--border-color);
            background: #090d16;
            color: #fff;
            box-sizing: border-box;
            margin-bottom: 12px;
            font-size: 0.95em;
        }

        .games-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
            gap: 12px;
        }

        .game-card {
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid var(--border-color);
            padding: 12px;
            border-radius: 8px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            transition: transform 0.2s;
        }

        .game-card:hover {
            transform: translateY(-2px);
            border-color: rgba(0, 229, 255, 0.4);
        }

        /* Chat Global */
        .chat-box {
            height: 240px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 8px;
            padding-right: 5px;
            background: rgba(0, 0, 0, 0.2);
            padding: 10px;
            border-radius: 8px;
            border: 1px solid var(--border-color);
            margin-bottom: 10px;
        }

        .chat-msg {
            background: rgba(255, 255, 255, 0.03);
            padding: 8px 12px;
            border-radius: 6px;
            font-size: 0.9em;
            word-break: break-word;
        }

        .chat-msg.mentioned {
            border-left: 3px solid var(--accent-color);
            background: rgba(0, 229, 255, 0.08);
        }

        .emoji-picker {
            display: flex;
            gap: 6px;
            margin-bottom: 10px;
            overflow-x: auto;
            padding-bottom: 4px;
        }

        .emoji-btn {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid var(--border-color);
            border-radius: 6px;
            font-size: 1.1em;
            padding: 5px 8px;
            cursor: pointer;
        }

        .emoji-btn:hover {
            background: rgba(255, 255, 255, 0.1);
        }

        .chat-inputs {
            display: flex;
            gap: 8px;
        }

        .chat-inputs input {
            flex: 1;
            padding: 11px 14px;
            border-radius: 8px;
            border: 1px solid var(--border-color);
            background: #090d16;
            color: #fff;
            font-size: 0.95em;
        }

        .btn {
            background: var(--accent-color);
            color: #000;
            border: none;
            padding: 0 18px;
            border-radius: 8px;
            font-weight: bold;
            cursor: pointer;
            transition: opacity 0.2s;
        }

        .btn:hover {
            opacity: 0.9;
        }

        /* Leaderboard */
        .leaderboard-list {
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        .leaderboard-item {
            display: flex;
            justify-content: space-between;
            padding: 8px 12px;
            background: rgba(255, 255, 255, 0.02);
            border-radius: 6px;
            font-size: 0.9em;
        }
    </style>
</head>
<body>

    <header>
        <h2 style="margin:0; color:var(--accent-color); font-size: 1.3em;">WaveCombat Hub</h2>
        <div class="user-status">
            <div class="status-dot" title="Online no Hub"></div>
            <span id="user-display-name" style="font-weight:600;">Carregando...</span>
            <span class="level-badge" id="user-level">Nível 1</span>
        </div>
    </header>

    <div class="container">
        <!-- Notificações PWA -->
        <div class="card" id="notif-card" style="display:none; background: linear-gradient(135deg, #131b2e, #1e293b);">
            <div style="display: flex; justify-content: space-between; align-items: center;">
                <span style="font-size: 0.9em;">🔔 Ativa as notificações para receber avisos de novos jogos e torneios!</span>
                <button class="btn" onclick="solicitarNotificacao()">Ativar</button>
            </div>
        </div>

        <!-- Perfil e Personalização -->
        <div class="card">
            <h3>Seu Perfil & Conta</h3>
            <div class="wallet-banner">
                <span>💎 Saldo de Diamantes:</span>
                <strong id="diamantes-saldo" style="color:var(--accent-color);">0 💎</strong>
            </div>
            <div class="color-picker-box">
                <label for="nick-color">Cor personalizada do seu Nick no Chat:</label>
                <input type="color" id="nick-color" value="#00e5ff" onchange="salvarCorNick(this.value)">
            </div>
        </div>

        <!-- Biblioteca de Jogos -->
        <div class="card">
            <h3>Biblioteca de Jogos</h3>
            <input type="text" class="search-box" id="search-input" placeholder="🔍 Pesquisar por título ou categoria..." oninput="filtrarJogos()">
            <div class="games-grid" id="games-list">
                <!-- Jogos carregados dinamicamente via Supabase -->
            </div>
        </div>

        <!-- Chat Global -->
        <div class="card">
            <h3>Chat Global ao Vivo</h3>
            <div class="chat-box" id="chat-messages">
                <!-- Mensagens do chat -->
            </div>
            
            <div class="emoji-picker">
                <button class="emoji-btn" onclick="addEmoji('🔥')">🔥</button>
                <button class="emoji-btn" onclick="addEmoji('🎮')">🎮</button>
                <button class="emoji-btn" onclick="addEmoji('😎')">😎</button>
                <button class="emoji-btn" onclick="addEmoji('🚀')">🚀</button>
                <button class="emoji-btn" onclick="addEmoji('🏆')">🏆</button>
                <button class="emoji-btn" onclick="addEmoji('💎')">💎</button>
                <button class="emoji-btn" onclick="addEmoji(' GG ')">GG</button>
            </div>

            <div class="chat-inputs">
                <input type="text" id="chat-input" placeholder="Digite sua mensagem... (Use @nick para mencionar)" onkeypress="if(event.key==='Enter') enviarMensagem()">
                <button class="btn" onclick="enviarMensagem()">Enviar</button>
            </div>
        </div>

        <!-- Ranking Global (Leaderboard) -->
        <div class="card">
            <h3>Ranking Global (Top Jogadores)</h3>
            <div class="leaderboard-list" id="leaderboard-list">
                <!-- Ranking carregado dinamicamente -->
            </div>
        </div>
    </div>

    <script>
        // ================= CONFIGURAÇÃO DO SUPABASE =================
        const SUPABASE_URL = "SUA_SUPABASE_URL";       // Substitua pela sua URL do Supabase
        const SUPABASE_KEY = "SUA_SUPABASE_ANON_KEY";   // Substitua pela sua Key anon do Supabase
        const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

        // Identificação persistente do utilizador no dispositivo
        let userId = localStorage.getItem('wc_user_id') || 'user_' + Math.random().toString(36).substr(2, 9);
        localStorage.setItem('wc_user_id', userId);

        let userNick = localStorage.getItem('wc_user_nick') || 'Player_' + Math.floor(Math.random() * 1000);
        localStorage.setItem('wc_user_nick', userNick);

        let userColor = localStorage.getItem('wc_user_color') || '#00e5ff';
        document.getElementById('nick-color').value = userColor;

        let ultimaMsgTempo = 0;
        document.getElementById('user-display-name').innerText = userNick;

        // ================= 1. PERFIL E DIAMANTES =================
        async function carregarPerfil() {
            // Saldo de Diamantes
            const { data: wallet } = await supabaseClient
                .from('carteira_diamantes')
                .select('diamantes')
                .eq('id_jogador', userId)
                .single();

            if (wallet) {
                document.getElementById('diamantes-saldo').innerText = `${wallet.diamantes || 0} 💎`;
            }

            // Nível e XP do Leaderboard / Perfil
            const { data: lb } = await supabaseClient
                .from('leaderboard')
                .select('nivel, xp, cor_nick')
                .eq('id_jogador', userId)
                .single();

            if (lb) {
                document.getElementById('user-level').innerText = `Nível ${lb.nivel || 1}`;
                if (lb.cor_nick) {
                    userColor = lb.cor_nick;
                    document.getElementById('nick-color').value = userColor;
                }
            }
        }

        function salvarCorNick(cor) {
            userColor = cor;
            localStorage.setItem('wc_user_color', cor);
            supabaseClient.from('leaderboard').update({ cor_nick: cor }).eq('id_jogador', userId);
        }

        // ================= 2. BIBLIOTECA DE JOGOS E BUSCA =================
        async function carregarJogos() {
            const { data } = await supabaseClient.from('jogos').select('*');
            window.listaJogos = data || [];
            renderizarJogos(window.listaJogos);
        }

        function renderizarJogos(jogos) {
            const container = document.getElementById('games-list');
            container.innerHTML = '';
            
            if (jogos.length === 0) {
                container.innerHTML = `<span style="color:var(--subtext-color); font-size:0.9em;">Nenhum jogo encontrado.</span>`;
                return;
            }

            jogos.forEach(j => {
                container.innerHTML += `
                    <div class="game-card">
                        <div>
                            <strong style="color:#fff;">${j.titulo}</strong>
                            <div style="font-size:0.8em; color:var(--subtext-color); margin-top:2px;">${j.categoria}</div>
                        </div>
                        <a href="${j.url_jogo}" style="color:var(--accent-color); font-size:0.9em; font-weight:bold; margin-top:10px; display:inline-block; text-decoration:none;">Jogar Agora ➔</a>
                    </div>
                `;
            });
        }

        function filtrarJogos() {
            const termo = document.getElementById('search-input').value.toLowerCase();
            const filtrados = window.listaJogos.filter(j => 
                j.titulo.toLowerCase().includes(termo) || j.categoria.toLowerCase().includes(termo)
            );
            renderizarJogos(filtrados);
        }

        // ================= 3. CHAT GLOBAL COM ANTI-SPAM & MENÇÕES =================
        async function carregarChat() {
            const { data } = await supabaseClient
                .from('chat_global')
                .select('*')
                .order('created_at', { ascending: true })
                .limit(50);

            const container = document.getElementById('chat-messages');
            container.innerHTML = '';

            if (data && data.length > 0) {
                data.forEach(msg => {
                    const isMentioned = msg.mensagem.includes(`@${userNick}`);
                    const div = document.createElement('div');
                    div.className = `chat-msg ${isMentioned ? 'mentioned' : ''}`;
                    
                    const corNick = msg.cor || '#00e5ff';
                    div.innerHTML = `<b style="color:${corNick}">${msg.nick}:</b> ${filtrarPalavroes(msg.mensagem)}`;
                    container.appendChild(div);
                });
                container.scrollTop = container.scrollHeight;
            } else {
                container.innerHTML = `<span style="color:var(--subtext-color); font-size:0.85em; text-align:center; margin-top:10px;">Nenhuma mensagem recente. Seja o primeiro a falar!</span>`;
            }
        }

        function filtrarPalavroes(texto) {
            const proibidas = ['spam_proibido']; // Podes adicionar termos aqui
            let limpo = texto;
            proibidas.forEach(p => {
                const reg = new RegExp(p, 'gi');
                limpo = limpo.replace(reg, '***');
            });
            return limpo;
        }

        async function enviarMensagem() {
            const input = document.getElementById('chat-input');
            const mensagem = input.value.trim();
            const agora = Date.now();

            // Proteção Anti-Spam: Intervalo de 2 segundos
            if (agora - ultimaMsgTempo < 2000) {
                alert("Calma! Aguarde 2 segundos entre as mensagens.");
                return;
            }

            if (!mensagem) return;

            ultimaMsgTempo = agora;
            input.value = '';

            await supabaseClient.from('chat_global').insert([
                { nick: userNick, mensagem: mensagem, cor: userColor }
            ]);

            carregarChat();
        }

        function addEmoji(emoji) {
            const input = document.getElementById('chat-input');
            input.value += emoji;
            input.focus();
        }

        // ================= 4. LEADERBOARD / RANKING GLOBAL =================
        async function carregarLeaderboard() {
            const { data } = await supabaseClient
                .from('leaderboard')
                .select('nick, pontos, nivel, cor_nick')
                .order('pontos', { ascending: false })
                .limit(10);

            const container = document.getElementById('leaderboard-list');
            container.innerHTML = '';

            if (data && data.length > 0) {
                data.forEach((item, index) => {
                    const cor = item.cor_nick || '#00e5ff';
                    container.innerHTML += `
                        <div class="leaderboard-item">
                            <span><b>#${index + 1}</b> <span style="color:${cor};">${item.nick}</span> <span style="font-size:0.75em; color:#3b82f6;">(Nível ${item.nivel || 1})</span></span>
                            <strong style="color:var(--accent-color);">${item.pontos} pts</strong>
                        </div>
                    `;
                });
            } else {
                container.innerHTML = `<span style="color:var(--subtext-color); font-size:0.85em;">Nenhuma pontuação registrada ainda.</span>`;
            }
        }

        // ================= 5. NOTIFICAÇÕES PWA =================
        function verificarNotificacao() {
            if ("Notification" in window && Notification.permission === "default") {
                document.getElementById('notif-card').style.display = 'block';
            }
        }

        function solicitarNotificacao() {
            Notification.requestPermission().then(permission => {
                if (permission === "granted") {
                    document.getElementById('notif-card').style.display = 'none';
                    new Notification("WaveCombat Hub", { body: "Notificações ativadas com sucesso!" });
                }
            });
        }

        // ================= INICIALIZAÇÃO DO HUB =================
        carregarPerfil();
        carregarJogos();
        carregarChat();
        carregarLeaderboard();
        verificarNotificacao();

        // Intervalos de atualização em tempo real
        setInterval(carregarChat, 4000);          // Atualiza chat a cada 4 segundos
        setInterval(carregarLeaderboard, 10000);  // Atualiza ranking a cada 10 segundos
    </script>
</body>
</html>
