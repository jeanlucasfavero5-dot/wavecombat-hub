<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>WaveCombat Hub</title>
  
  <!-- Configuração do PWA (Ícone Oficial + Rotação de Tela) -->
  <link rel="manifest" id="manifest-placeholder">
  <meta name="theme-color" content="#0d0f17">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">

  <style>
    :root {
      --bg-color: #0d0f17;
      --card-bg: #161925;
      --accent-color: #00f2fe;
      --text-color: #ffffff;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }

    body {
      background-color: var(--bg-color);
      color: var(--text-color);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    header {
      background: rgba(22, 25, 37, 0.9);
      padding: 15px 20px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 2px solid var(--accent-color);
    }

    .logo {
      font-size: 1.5rem;
      font-weight: bold;
      color: var(--accent-color);
      text-transform: uppercase;
      letter-spacing: 1px;
    }

    .audio-controls {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .btn {
      background: var(--accent-color);
      color: #000;
      border: none;
      padding: 8px 16px;
      border-radius: 5px;
      font-weight: bold;
      cursor: pointer;
    }

    main {
      padding: 20px;
      flex: 1;
    }

    .games-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
      gap: 20px;
      margin-top: 20px;
    }

    .game-card {
      background: var(--card-bg);
      border-radius: 10px;
      padding: 15px;
      text-align: center;
      border: 1px solid rgba(255, 255, 255, 0.1);
      cursor: pointer;
      transition: transform 0.2s;
    }

    .game-card:hover {
      transform: translateY(-5px);
      border-color: var(--accent-color);
    }

    /* Modais / Frames de Jogos e Vídeo */
    .modal {
      display: none;
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0, 0, 0, 0.95);
      z-index: 1000;
      flex-direction: column;
    }

    .modal-header {
      padding: 10px 20px;
      background: #000;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .modal-body {
      flex: 1;
      width: 100%;
      height: 100%;
    }

    iframe {
      width: 100%;
      height: 100%;
      border: none;
    }
  </style>
</head>
<body>

  <header>
    <div class="logo">WaveCombat Hub</div>
    <div class="audio-controls">
      <button id="audio-toggle" class="btn">🔊 Música: LIGADA</button>
    </div>
  </header>

  <main>
    <h2>Seus Jogos Multiplayer</h2>
    <div class="games-grid">
      <div class="game-card" onclick="openGame('gravitas-arena', 'Gravitas Arena')">
        <h3>Gravitas Arena</h3>
      </div>
      <div class="game-card" onclick="openGame('zombie-house', 'Zombie House')">
        <h3>Zombie House</h3>
      </div>
      <div class="game-card" onclick="openGame('pulse-fighter', 'Pulse Fighter')">
        <h3>Pulse Fighter</h3>
      </div>
      <div class="game-card" onclick="openGame('riverbed-warfare', 'Riverbed Warfare')">
        <h3>Riverbed Warfare</h3>
      </div>
      <div class="game-card" onclick="openGame('supercar-circuit', 'Supercar Circuit')">
        <h3>Supercar Circuit</h3>
      </div>
    </div>
  </main>

  <!-- Player de Áudio Arcade Integrado -->
  <audio id="bg-music" loop preload="auto">
    <source src="https://cdn.pixabay.com/download/audio/2022/03/15/audio_c8c8a7346b.mp3" type="audio/mpeg">
  </audio>

  <!-- Modal do Jogo / Player -->
  <div id="game-modal" class="modal">
    <div class="modal-header">
      <h3 id="modal-title">Jogando</h3>
      <button class="btn" onclick="closeGame()">Fechar X</button>
    </div>
    <div class="modal-body" id="modal-container"></div>
  </div>

  <script>
    // 1. CONFIGURAÇÃO DINÂMICA DO PWA (ÍCONE CORRETO + ROTAÇÃO)
    const manifestData = {
      "name": "WaveCombat Hub",
      "short_name": "WaveCombat",
      "start_url": "./",
      "display": "standalone",
      "orientation": "any",
      "background_color": "#0d0f17",
      "theme_color": "#0d0f17",
      "icons": [
        {
          "src": "https://img.icons8.com/game-controller/192/00f2fe/controller.png",
          "sizes": "192x192",
          "type": "image/png"
        },
        {
          "src": "https://img.icons8.com/game-controller/512/00f2fe/controller.png",
          "sizes": "512x512",
          "type": "image/png"
        }
      ]
    };

    const manifestBlob = new Blob([JSON.stringify(manifestData)], { type: 'application/json' });
    document.getElementById('manifest-placeholder').setAttribute('href', URL.createObjectURL(manifestBlob));

    // 2. CONTROLE DE ÁUDIO COM AUTOPLAY E PAUSA AUTOMÁTICA
    const bgMusic = document.getElementById('bg-music');
    const audioBtn = document.getElementById('audio-toggle');
    let isAudioMuted = false;

    // Tentar tocar na primeira interação do usuário (Exigência dos navegadores)
    function enableAutoAudio() {
      if (!isAudioMuted && bgMusic.paused) {
        bgMusic.play().then(() => {
          console.log("Música iniciada automaticamente.");
        }).catch(err => console.log("Aguardando clique para áudio..."));
      }
      document.removeEventListener('click', enableAutoAudio);
      document.removeEventListener('touchstart', enableAutoAudio);
    }

    document.addEventListener('click', enableAutoAudio);
    document.addEventListener('touchstart', enableAutoAudio);

    audioBtn.addEventListener('click', () => {
      if (bgMusic.paused) {
        bgMusic.play();
        isAudioMuted = false;
        audioBtn.textContent = '🔊 Música: LIGADA';
      } else {
        bgMusic.pause();
        isAudioMuted = true;
        audioBtn.textContent = '🔇 Música: DESLIGADA';
      }
    });

    // 3. ABRIR JOGO / VÍDEO (PAUSA MÚSICA & PERMITE ROTAÇÃO DA TELA)
    function openGame(gameId, title) {
      // Pausa a música de fundo
      bgMusic.pause();

      // Permitir rotação de tela no celular via API Screen Orientation
      if (screen.orientation && screen.orientation.unlock) {
        try { screen.orientation.unlock(); } catch(e) {}
      }

      document.getElementById('modal-title').textContent = title;
      document.getElementById('modal-container').innerHTML = `<iframe src="./games/${gameId}/index.html"></iframe>`;
      document.getElementById('game-modal').style.display = 'flex';
    }

    function closeGame() {
      document.getElementById('game-modal').style.display = 'none';
      document.getElementById('modal-container').innerHTML = '';

      // Retoma a música se não estiver mutada pelo usuário
      if (!isAudioMuted) {
        bgMusic.play();
      }
    }
  </script>
</body>
</html>
