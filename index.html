    function formatarNumero(num) {
        if (num === null || num === undefined) return '0';
        num = Number(num);
        if (isNaN(num)) return '0';
        if (num >= 1e12) return (num / 1e12).toFixed(1).replace('.0', '') + 'T';
        if (num >= 1e9) return (num / 1e9).toFixed(1).replace('.0', '') + 'B';
        if (num >= 1e6) return (num / 1e6).toFixed(1).replace('.0', '') + 'M';
        if (num >= 1e3) {
            return (num / 1000).toLocaleString('pt-BR', { maximumFractionDigits: 1 }) + 'k';
        }
        return num.toLocaleString('pt-BR');
    }

    async function enviarPedidoAmizade() {
        const termo = document.getElementById('inputAdicionarAmigo').value.trim();
        if (!termo) return;

        const alvo = await buscarUsuarioPorNickOuId(termo);
        if (!alvo) {
            alert("❌ Jogador não encontrado!");
            return;
        }

        if (alvo.id === String(usuarioLogado.id)) {
            alert("⚠️ Você não pode adicionar a si mesmo!");
            return;
        }

        try {
            const { data: existe } = await supabaseClient
                .from('wavecombat_amigos')
                .select('*')
                .or(`and(id_jogador.eq.${usuarioLogado.id},id_amigo.eq.${alvo.id}),and(id_jogador.eq.${alvo.id},id_amigo.eq.${usuarioLogado.id})`)
                .maybeSingle();

            if (existe) {
                alert("⚠️ Já existe um vínculo ou pedido pendente com este jogador!");
                return;
            }

            await supabaseClient.from('wavecombat_amigos').insert([
                { id_jogador: String(usuarioLogado.id), id_amigo: alvo.id, status: 'pendente' }

            mostrarToast(`📨 Pedido de amizade enviado para ${alvo.nick}!`);

            carregarListaAmigos();

            alert("Erro ao enviar pedido de amizade.");

    async function carregarListaAmigos() {
        if (!usuarioLogado) return;
        const idUser = String(usuarioLogado.id);

        try {
            const { data: amizades } = await supabaseClient
                .from('wavecombat_amigos')
                .select('*')
                .or(`id_jogador.eq.${idUser},id_amigo.eq.${idUser}`);

            if (!amizades) return;

            let onlineContainer = document.getElementById('listaAmigosOnline');
            let offlineContainer = document.getElementById('listaAmigosOffline');
            let pendenteContainer = document.getElementById('listaPedidosPendentes');

            onlineContainer.innerHTML = '';
            offlineContainer.innerHTML = '';
            pendenteContainer.innerHTML = '';

            let qtdOnlineCount = 0;
            let qtdOfflineCount = 0;

            for (let rel of amizades) {
                let idOutro = rel.id_jogador === idUser ? rel.id_amigo : rel.id_jogador;
                let infoOutro = await buscarUsuarioPorNickOuId(idOutro);
                if (!infoOutro) continue;

                if (rel.status === 'pendente') {
                    if (rel.id_amigo === idUser) {
                        pendenteContainer.innerHTML += `

                                    <button class="btn-gaming btn-danger" onclick="responderAmizade(${rel.id}, 'recusar')" style="padding:2px 6px; font-size:9px;">X</button>
                                </div>
                            </div>
                        `;
                    }
                } else if (rel.status === 'aceito') {
                    let isOnline = Math.random() > 0.5;
                    let jogandoAgora = isOnline ? "Jogando Riverbed Warfare" : "Offline";

                    let htmlCard = `
                        <div style="background:#0b0f17; border:1px solid var(--steel-border); padding:8px; border-radius:6px; display:flex; flex-direction:column; gap:4px;">
                            <div style="display:flex; justify-content:space-between; align-items:center;">
                                <strong style="cursor:pointer; color:#fff;" onclick="abrirPerfilPublico('${infoOutro.id}')">${infoOutro.nick}</strong>
                                <button onclick="removerAmizade(${rel.id})" style="background:none; border:none; color:var(--alert-red); cursor:pointer; font-size:10px;">Remover</button>
                            </div>
                            <span style="font-size:10px; color:${isOnline ? '#22c55e' : '#64748b'};">${jogandoAgora}</span>

                        onlineContainer.innerHTML += htmlCard;
                        qtdOnlineCount++;
                    } else {
                        offlineContainer.innerHTML += htmlCard;
                        qtdOfflineCount++;
                    }

            }

            document.getElementById('countAmigosOnline').textContent = qtdOnlineCount;
            document.getElementById('labelQtdOnline').textContent = qtdOnlineCount;
            document.getElementById('labelQtdOffline').textContent = qtdOfflineCount;

            if (onlineContainer.innerHTML === '') onlineContainer.innerHTML = `<span style="color:#64748b; font-style:italic;">Nenhum amigo online.</span>`;
            if (offlineContainer.innerHTML === '') offlineContainer.innerHTML = `<span style="color:#64748b; font-style:italic;">Nenhum amigo offline.</span>`;
            if (pendenteContainer.innerHTML === '') pendenteContainer.innerHTML = `<span style="color:#64748b; font-style:italic;">Nenhum pedido pendente.</span>`;

    function playBGMNote() {
        if (!bgmActive) return;
        try {
            if (audioCtx.state === 'suspended') audioCtx.resume();
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.type = 'square'; 
            osc.frequency.setValueAtTime(arcadeNotes[noteIndex], audioCtx.currentTime);
            
            gain.gain.setValueAtTime(bgmVolumeValue * 0.04, audioCtx.currentTime);
            gain.gain.exponentialRampToValueAtTime(0.0001, audioCtx.currentTime + 0.16);
            
            osc.connect(gain);
            gain.connect(audioCtx.destination);
            
            osc.start();
            osc.stop(audioCtx.currentTime + 0.16);
            
            noteIndex = (noteIndex + 1) % arcadeNotes.length;
        } catch(e) {}
    }

    function toggleBGM(ativo) {
        bgmActive = ativo;

    const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    function tocarSomClique() {
        if (!audioSfxAtivo) return;
        try {
            if (audioCtx.state === 'suspended') audioCtx.resume();
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.type = 'sine';
            osc.frequency.setValueAtTime(440, audioCtx.currentTime);
            osc.frequency.exponentialRampToValueAtTime(880, audioCtx.currentTime + 0.08);
            gain.gain.setValueAtTime(0.05, audioCtx.currentTime);
            gain.gain.linearRampToValueAtTime(0, audioCtx.currentTime + 0.08);
            osc.connect(gain); gain.connect(audioCtx.destination);
            osc.start(); osc.stop(audioCtx.currentTime + 0.08);
        } catch(e) {}
    }

    function tocarSomLevelUp() {
        if (!audioSfxAtivo) return;
        try {
            if (audioCtx.state === 'suspended') audioCtx.resume();
            const now = audioCtx.currentTime;
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.type = 'triangle';
            osc.frequency.setValueAtTime(300, now);
            osc.frequency.setValueAtTime(450, now + 0.1);
            osc.frequency.setValueAtTime(600, now + 0.2);
            gain.gain.setValueAtTime(0.08, now);
            gain.gain.linearRampToValueAtTime(0, now + 0.35);
            osc.connect(gain); gain.connect(audioCtx.destination);
            osc.start(now); osc.stop(now + 0.35);
        } catch(e) {}
    }

                if (infData) {
                    bonusDiamantes = Math.round(quantDiamantes * 0.05);
                    quantDiamantes += bonusDiamantes;

                    await supabaseClient.from('influenciadores').update({

        try {
            const res = await fetch(`${SUPABASE_URL}/functions/v1/gerar-pix`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ valor: valor, diamantes: quantDiamantes, id_jogador: idJogador, nick: nick })
            });
            const data = await res.json();
            if (data.qr_code_base64 && data.qr_code) {

                        carregarSaldoDiamantesSite();
                        tocarSomLevelUp();

            } else {
                alert("Erro ao gerar o Pix. Verifique os dados.");

        }
    }

    async function buscarUsuarioPorNickOuId(termo) {
        termo = termo.trim();
        if (!termo) return null;

        try {
            let { data } = await supabaseClient
                .from('usuarios')
                .select('*')
                .or(`id.eq.${termo},id_jogador.eq.${termo},nick.ilike.${termo}`)
                .maybeSingle();

            if (data) {
                return { id: String(data.id_jogador || data.id), nick: data.nick };
            }
        } catch(e){}

        try {
            let { data: carData } = await supabaseClient
                .from('carteira_diamantes')
                .select('*')
                .or(`id_jogador.eq.${termo},nick.ilike.${termo}`)
                .maybeSingle();

            if (carData) {
                return { id: String(carData.id_jogador), nick: carData.nick || carData.id_jogador };
            }
        } catch(e){}

        if (/^\d+$/.test(termo)) {
            return { id: termo, nick: termo };
        }
        return null;
    }

            const { data } = await supabaseClient.from('usuarios').select('*');
            if (data) {
                return data.map(u => ({ nick: u.nick, pass: u.pass || '', id: String(u.id_jogador || u.id) }));
            }
        } catch(e){}
        return [];
    }

    async function renderizarTabelaUsuariosAdmin() {
        let container = document.getElementById('adminListaUsuariosContainer');
        if (!container) return;
        let filtro = (document.getElementById('inputBuscaAdminUser')?.value || '').toLowerCase();
        let usuarios = await obterUsuariosCadastrados();
        
        let diamantesDict = {};
        try {
            const { data: dList } = await supabaseClient.from('carteira_diamantes').select('id_jogador, diamantes');
            if (dList) {
                dList.forEach(d => { diamantesDict[String(d.id_jogador)] = d.diamantes || 0; });
            }
        } catch(e){}

        let banidosDict = {};
        try {
            const { data: bList } = await supabaseClient.from('wavecombat_banidos').select('*');
            if (bList) {
                bList.forEach(b => { banidosDict[String(b.id_jogador)] = new Date(b.expira_em).getTime(); });
            }
        } catch(e){}

        if (!usuarios || usuarios.length === 0) {
            container.innerHTML = `<p style="color:#94a3b8; font-size:11px; text-align:center;">Nenhum usuário cadastrado.</p>`;
            return;
        }

        usuarios.sort((a, b) => (a.nick || '').localeCompare(b.nick || '', 'pt-BR', { sensitivity: 'base' }));
        let filtrados = usuarios.filter(u => (u.nick && u.nick.toLowerCase().includes(filtro)) || (u.id && String(u.id).includes(filtro)));
        
        container.innerHTML = filtrados.map(u => {
            let expira = banidosDict[u.id];
            let isBan = expira && Date.now() < expira;
            let diamantesUser = diamantesDict[u.id] || 0;
            return `
                <div style="display:flex; justify-content:space-between; align-items:center; background:#070a10; border:1px solid var(--steel-border); padding:8px; border-radius:6px; font-size:11px; flex-wrap:wrap; gap:6px;">
                    <div style="display:flex; align-items:center; gap:6px;">
                        <strong>${obterHtmlNickVerificado(u.nick, u.id)}</strong><span style="color:#64748b;">(ID: ${u.id})</span>
                        <span style="color:var(--accent-color); font-weight:bold; background:rgba(0,240,255,0.1); padding:2px 6px; border-radius:4px;">💎 ${formatarNumero(diamantesUser)}</span>
                        ${isBan ? '<span style="color:var(--alert-red);">[BANIDO]</span>' : ''}
                    </div>
                    <div style="display:flex; gap:4px; align-items:center;">
                        <select id="selectBan_${u.id}" class="auth-input" style="padding:4px; font-size:10px; width:auto;">
                            <option value="7d">Ban 7 Dias</option>
                            <option value="1m">Ban 1 Mês</option>
                            <option value="999a">Ban 999 Anos</option>
                        </select>
                        <button class="btn-gaming btn-danger" onclick="aplicarBanimentoUser('${u.id}')" style="padding:4px 8px; font-size:10px;">Banir</button>
                        ${isBan ? `<button class="btn-gaming" onclick="removerBanimentoUser('${u.id}')" style="padding:4px 8px; font-size:10px; background:#22c55e; color:#000;">Desbanir</button>` : ''}
                    </div>
                </div>
            `;
        }).join('');
    }

    async function aplicarBanimentoUser(id) {
        let duracao = document.getElementById(`selectBan_${id}`).value;
        let tempoMs = 7 * 24 * 60 * 60 * 1000;
        if (duracao === '1m') tempoMs = 30 * 24 * 60 * 60 * 1000;
        if (duracao === '999a') tempoMs = 999 * 365 * 24 * 60 * 60 * 1000;
        let expiraEmIso = new Date(Date.now() + tempoMs).toISOString();

        try {
            await supabaseClient.from('wavecombat_banidos').upsert([{ id_jogador: String(id), expira_em: expiraEmIso }], { onConflict: 'id_jogador' });
            mostrarToast("🔨 Usuário banido na nuvem!");
            renderizarTabelaUsuariosAdmin();
        } catch(e) {
            alert("Erro ao aplicar banimento na nuvem.");
        }
    }

    async function removerBanimentoUser(id) {
        try {
            await supabaseClient.from('wavecombat_banidos').delete().eq('id_jogador', String(id));
            mostrarToast("✨ Banimento removido!");
            renderizarTabelaUsuariosAdmin();
        } catch(e) {
            alert("Erro ao remover banimento.");
        }
    }

    async function carregarCorreioUsuario() {
        let container = document.getElementById('correioMensagensContainer');
        if (!container || !usuarioLogado) return;

        let idUser = String(usuarioLogado.id);
        let minhasMsgs = [];

        try {
            const { data } = await supabaseClient
                .from('correios')
                .select('*')
                .eq('id_jogador', idUser)
                .order('created_at', { ascending: false });

            if (data && data.length > 0) {
                minhasMsgs = data.map(m => ({
                    id: m.id,
                    tipo: m.tipo,
                    titulo: m.titulo,
                    mensagem: m.mensagem,
                    codigoCupom: m.codigo_cupom,
                    data: m.data || new Date(m.created_at).toLocaleDateString('pt-BR'),
                    resgatado: m.resgatado
                }));
            }
        } catch(e){}

        if (minhasMsgs.length === 0) {
            container.innerHTML = `<p style="color:#94a3b8; text-align:center; font-size:11px;">Nenhuma mensagem no correio.</p>`;
            return;
        }

        container.innerHTML = minhasMsgs.map(m => `
            <div style="background:#0b0f17; border:1px solid ${m.resgatado ? 'var(--steel-border)' : '#FFD700'}; padding:10px; border-radius:8px; margin-bottom:8px; font-size:11px;">
                <div style="display:flex; justify-content:space-between; margin-bottom:4px;">
                    <strong style="color:var(--accent-color);">${m.titulo}</strong>
                    <span style="color:#64748b; font-size:9px;">${m.data}</span>
                </div>
                <p style="color:#94a3b8; margin-bottom:8px;">${m.mensagem}</p>
                ${!m.resgatado ? `<button class="btn-gaming" onclick="resgatarPremioCorreio(${m.id}, '${m.codigoCupom || ''}')" style="background:#FFD700; color:#000; width:100%; padding:6px; font-size:10px;">🎁 Resgatar Benefícios & Prêmios</button>` : `<span style="color:#22c55e; font-weight:bold;">✅ Prêmios Resgatados</span>`}
            </div>
        `).join('');
    }

    async function resgatarPremioCorreio(dbId, codigoCupomMsg) {
        if (!usuarioLogado) return;
        let idUser = String(usuarioLogado.id);
        let nickUser = usuarioLogado.nick;
        let cupomFinal = (codigoCupomMsg && codigoCupomMsg.trim() !== '') ? codigoCupomMsg : (nickUser.toUpperCase() + '7');

        try {
            await supabaseClient.from('correios').update({ resgatado: true }).eq('id', dbId);

            await supabaseClient.from('wavecombat_verificados').upsert([
                { id_jogador: idUser, nick: nickUser }
            ], { onConflict: 'id_jogador' });

            await supabaseClient.from('influenciadores').upsert([
                { id_jogador: idUser, nick: nickUser, cupom: cupomFinal, usos: 0, comissao: 0.00 }
            ], { onConflict: 'id_jogador' });

            const { data: carteira } = await supabaseClient.from('carteira_diamantes').select('diamantes').eq('id_jogador', idUser).single();
            let saldoAtual = carteira ? (carteira.diamantes || 0) : 0;
            await supabaseClient.from('carteira_diamantes').upsert({ id_jogador: idUser, nick: nickUser, diamantes: saldoAtual + 5000 }, { onConflict: 'id_jogador' });

            await carregarVerificadosNuvem();

            await atualizarPerfilExpandidoUI();
            await renderizarTabelaInfluenciadoresAdmin();
            
            document.getElementById('btnAuthNav').innerHTML = obterHtmlNickVerificado(nickUser, idUser);
        } catch(e){
            alert("Erro ao resgatar benefícios da nuvem.");
        }
    }
