<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WaveCombat Hub</title>
    <link rel="manifest" href="manifest.json">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        :root {
            --bg-color: #0b0f19;
            --card-bg: #131b2e;
            --accent-color: #00e5ff;
            --text-color: #ffffff;
            --subtext-color: #94a3b8;
        }

        body {
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
        }

        header {
            width: 100%;
            max-width: 800px;
            padding: 15px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            box-sizing: border-box;
            background: rgba(19, 27, 46, 0.8);
            backdrop-filter: blur(10px);
            position: sticky;
            top: 0;
            z-index: 100;
        }

        .user-status {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .status-dot {
            width: 10px;
            height: 10px;
            border-radius: 50%;
            background-color: #10b981;
            box-shadow: 0 0 8px #10b981;
        }

        .container {
            width: 100%;
            max-width: 800px;
            padding: 15px;
            box-sizing: border-box;
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        .card {
            background-color: var(--card-bg);
            border-radius: 12px;
            padding: 15px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.3);
            border: 1px solid rgba(255, 255, 255, 0.05);
        }

        /* Busca de Jogos */
        .search-box {
            width: 100%;
            padding: 10px 15px;
            border-radius: 8px;
            border: 1px solid rgba(255, 255, 255, 0.1);
            background: #090d16;
            color: #fff;
            box-sizing: border-box;
            margin-bottom: 15px;
        }

        /* Chat Styles */
        .chat-box {
            height: 250px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 8px;
            padding-right: 5px;
        }

        .chat-msg {
            background: rgba(255, 255, 255, 0.03);
            padding: 8px 12px;
            border-radius: 6px;
            font-size: 0.9em;
            word-break: break-word;
        }

        .chat-msg.mentioned {
            border-left: 3px solid var(--accent-color);
            background: rgba(0, 229, 255, 0.1);
        }

        .emoji-picker {
            display: flex;
            gap: 5px;
            margin-top: 8px;
            overflow-x: auto;
        }

        .emoji-btn {
            background: none;
            border: none;
            font-size: 1.2em;
            cursor: pointer;
        }

        .chat-inputs {
            display: flex;
            gap: 8px;
            margin-top: 10px;
        }

        .chat-inputs input {
            flex: 1;
            padding: 10px;
            border-radius: 6px;
            border: 1px solid rgba(255, 255, 255, 0.1);
            background: #090d16;
            color: #fff;
        }

        .btn {
            background: var(--accent-color);
            color: #000;
            border: none;
            padding: 10px 15px;
            border-radius: 6px;
            font-weight: bold;
            cursor: pointer;
        }

        /* Perfil e XP */
        .level-badge {
            background: #3b82f6;
            color: #fff;
            padding: 2px 8px;
            border-radius: 12px;
            font-size: 0.8em;
            font-weight: bold;
        }

        .color-picker-box {
            display: flex;
            gap: 10px;
            align-items: center;
            margin-top: 10px;
        }
    </style>
</head>
<body>

    <header>
        <h2 style="margin:0; color:var(--accent-color);">WaveCombat Hub</h2>
        <div class="user-status">
            <div class="status-dot"></div>
            <span id="user-display-name">Carregando...</span>
            <span class="level-badge" id="user-level">Nível 1</span>
        </div>
    </header>

    <div class="container">
        <!-- Notificações PWA -->
        <div class="card" id="notif-card" style="display:none;">
            <span>Ative as notificações para receber novidades e torneios!</span>
            <button class="btn" style="margin-left: 10px;" onclick="solicitarNotificacao()">Ativar</button>
        </div>

        <!-- Perfil e Personalização -->
        <div class="card">
            <h3>Seu Perfil & Personalização</h3>
            <div class="color-picker-box">
                <label for="nick-color">Cor do seu Nick no Chat:</label>
                <input type="color" id="nick-color" value="#00e5ff" onchange="salvarCorNick(this.value)">
            </div>
        </div>

        <!-- Biblioteca de Jogos -->
        <div class="card">
            <h3>Jogos</h3>
            <input type="text" class="search-box" id="search-input" placeholder="Buscar jogo..." oninput="filtrarJogos()">
            <div id="games-list">
                <!-- Os jogos serão carregados dinamicamente -->
            </div>
        </div>

        <!-- Chat Global -->
        <div class="card">
            <h3>Chat Global ao Vivo</h3>
            <div class="chat-box" id="chat-messages">
                <!-- Mensagens entram aqui -->
            </div>
            
            <div class="emoji-picker">
                <button class="emoji-btn" onclick="addEmoji('🔥')">🔥</button>
                <button class="emoji-btn" onclick="addEmoji('🎮')">🎮</button>
                <button class="emoji-btn" onclick="addEmoji('😎')">😎</button>
                <button class="emoji-btn" onclick="addEmoji('🚀')">🚀</button>
                <button class="emoji-btn" onclick="addEmoji('🏆')">🏆</button>
            </div>

            <div class="chat-inputs">
                <input type="text" id="chat-input" placeholder="Digite uma mensagem... (Use @ para mencionar)" onkeypress="if(event.key==='Enter') enviarMensagem()">
                <button class="btn" onclick="enviarMensagem()">Enviar</button>
            </div>
        </div>
    </div>

    <script>
        // CONFIGURAÇÃO DO SUPABASE
        const SUPABASE_URL = "SUA_SUPABASE_URL";
        const SUPABASE_KEY = "SUA_SUPABASE_ANON_KEY";
        const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

        let userId = localStorage.getItem('wc_user_id') || 'user_' + Math.random().toString(36).substr(2, 9);
        localStorage.setItem('wc_user_id', userId);

        let userNick = localStorage.getItem('wc_user_nick') || 'Jogador_' + Math.floor(Math.random() * 1000);
        localStorage.setItem('wc_user_nick', userNick);

        let userColor = localStorage.getItem('wc_user_color') || '#00e5ff';
        document.getElementById('nick-color').value = userColor;

        let ultimaMsgTempo = 0;

        document.getElementById('user-display-name').innerText = userNick;

        // 1. CARREGAR PERFIL & XP
        async function carregarPerfil() {
            const { data, error } = await supabaseClient
                .from('leaderboard')
                .select('nivel, xp, cor_nick')
                .eq('id_jogador', userId)
                .single();

            if (data) {
                document.getElementById('user-level').innerText = `Nível ${data.nivel || 1}`;
                if (data.cor_nick) {
                    userColor = data.cor_nick;
                    document.getElementById('nick-color').value = userColor;
                }
            }
        }

        function salvarCorNick(cor) {
            userColor = cor;
            localStorage.setItem('wc_user_color', cor);
            supabaseClient.from('leaderboard').update({ cor_nick: cor }).eq('id_jogador', userId);
        }

        // 2. CHAT COM FILTRO ANTI-SPAM, MENÇÃO & EMOJIS
        async function carregarChat() {
            const { data } = await supabaseClient
                .from('chat_global')
                .select('*')
                .order('created_at', { ascending: true })
                .limit(50);

            const container = document.getElementById('chat-messages');
            container.innerHTML = '';

            if (data) {
                data.forEach(msg => {
                    const isMentioned = msg.mensagem.includes(`@${userNick}`);
                    const div = document.createElement('div');
                    div.className = `chat-msg ${isMentioned ? 'mentioned' : ''}`;
                    div.innerHTML = `<b style="color:${msg.cor || '#00e5ff'}">${msg.nick}:</b> ${filtrarPalavroes(msg.mensagem)}`;
                    container.appendChild(div);
                });
                container.scrollTop = container.scrollHeight;
            }
        }

        function filtrarPalavroes(texto) {
            const proibidas = ['palavrao1', 'palavrao2', 'spam']; // Adicione termos indesejados aqui
            let limpo = texto;
            proibidas.forEach(p => {
                const reg = new RegExp(p, 'gi');
                limpo = limpo.replace(reg, '***');
            });
            return limpo;
        }

        async function enviarMensagem() {
            const input = document.getElementById('chat-input');
            const mensagem = input.value.trim();
            const agora = Date.now();

            // Anti-Spam: 2 segundos de intervalo
            if (agora - ultimaMsgTempo < 2000) {
                alert("Calma lá! Aguarde 2 segundos entre as mensagens.");
                return;
            }

            if (!mensagem) return;

            ultimaMsgTempo = agora;
            input.value = '';

            await supabaseClient.from('chat_global').insert([
                { nick: userNick, mensagem: mensagem, cor: userColor }
            ]);

            carregarChat();
        }

        function addEmoji(emoji) {
            const input = document.getElementById('chat-input');
            input.value += emoji;
            input.focus();
        }

        // 3. BUSCA E FILTRO DE JOGOS
        async function carregarJogos() {
            const { data } = await supabaseClient.from('jogos').select('*');
            window.listaJogos = data || [];
            renderizarJogos(window.listaJogos);
        }

        function renderizarJogos(jogos) {
            const container = document.getElementById('games-list');
            container.innerHTML = '';
            jogos.forEach(j => {
                container.innerHTML += `
                    <div style="padding: 10px; background: rgba(255,255,255,0.05); margin-bottom: 8px; border-radius: 6px;">
                        <b>${j.titulo}</b> (${j.categoria})<br>
                        <a href="${j.url_jogo}" style="color:var(--accent-color);">Jogar Agora</a>
                    </div>
                `;
            });
        }

        function filtrarJogos() {
            const termo = document.getElementById('search-input').value.toLowerCase();
            const filtrados = window.listaJogos.filter(j => 
                j.titulo.toLowerCase().includes(termo) || j.categoria.toLowerCase().includes(termo)
            );
            renderizarJogos(filtrados);
        }

        // 4. NOTIFICAÇÕES PWA
        function verificarNotificacao() {
            if ("Notification" in window && Notification.permission === "default") {
                document.getElementById('notif-card').style.display = 'block';
            }
        }

        function solicitarNotificacao() {
            Notification.requestPermission().then(permission => {
                if (permission === "granted") {
                    document.getElementById('notif-card').style.display = 'none';
                    new Notification("WaveCombat Hub", { body: "Notificações ativadas com sucesso!" });
                }
            });
        }

        // INICIALIZAÇÃO
        carregarPerfil();
        carregarChat();
        carregarJogos();
        verificarNotificacao();
        setInterval(carregarChat, 4000); // Atualiza chat a cada 4 seg
    </script>
</body>
</html>
