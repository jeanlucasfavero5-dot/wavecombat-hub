<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WAVECOMBAT - Painel de Controle</title>
    <!-- Supabase JS Client -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        :root {
            --bg-color: #0b0d19;
            --panel-bg: rgba(18, 22, 41, 0.95);
            --border-color: #1e2640;
            --accent-green: #00e676;
            --accent-gold: #ffb300;
            --accent-danger: #ff5252;
            --accent-blue: #00b0ff;
            --text-main: #e0e6ed;
            --text-muted: #8a99ad;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            padding: 20px;
            display: flex;
            justify-content: center;
        }

        .container {
            width: 100%;
            max-width: 500px;
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        .card {
            background: var(--panel-bg);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 20px;
            box-shadow: 0 8px 24px rgba(0,0,0,0.5);
        }

        .card-gold {
            border: 2px solid var(--accent-gold);
            background: rgba(255, 179, 0, 0.03);
        }

        h2, h3 {
            margin-bottom: 15px;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .gold-title {
            color: var(--accent-gold);
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .subtitle {
            font-size: 0.85rem;
            color: var(--text-muted);
            margin-bottom: 15px;
            line-height: 1.4;
        }

        .form-group {
            display: flex;
            gap: 10px;
            margin-bottom: 12px;
        }

        input, select {
            flex: 1;
            background: #131729;
            border: 1px solid var(--border-color);
            border-radius: 6px;
            padding: 10px 14px;
            color: #fff;
            font-size: 0.9rem;
            outline: none;
        }

        input:focus {
            border-color: var(--accent-blue);
        }

        .btn {
            width: 100%;
            padding: 12px;
            border: none;
            border-radius: 6px;
            font-weight: bold;
            text-transform: uppercase;
            cursor: pointer;
            transition: 0.2s;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 8px;
        }

        .btn-green {
            background: var(--accent-green);
            color: #000;
        }

        .btn-green:hover {
            background: #00c853;
        }

        .btn-gold {
            background: var(--accent-gold);
            color: #000;
        }

        .btn-gold:hover {
            background: #ffa000;
        }

        .btn-danger {
            background: var(--accent-danger);
            color: #fff;
            padding: 6px 12px;
            font-size: 0.8rem;
        }

        .btn-small-gold {
            background: var(--accent-gold);
            color: #000;
            padding: 6px 12px;
            font-size: 0.8rem;
        }

        .influencer-item {
            background: rgba(0, 0, 0, 0.3);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            padding: 12px;
            margin-top: 10px;
            font-size: 0.85rem;
        }

        .influencer-header {
            font-weight: bold;
            color: var(--accent-blue);
            margin-bottom: 4px;
        }

        .influencer-stats {
            color: var(--text-muted);
            margin-bottom: 8px;
        }

        .influencer-actions {
            display: flex;
            gap: 8px;
        }

        /* Modal Perfil / Correio */
        .modal {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.8);
            justify-content: center;
            align-items: center;
            z-index: 1000;
        }

        .modal-content {
            background: var(--panel-bg);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            width: 90%;
            max-width: 400px;
            padding: 20px;
            position: relative;
        }

        .close-btn {
            position: absolute;
            top: 12px; right: 15px;
            font-size: 1.2rem;
            cursor: pointer;
            color: var(--text-muted);
        }

        .mail-item {
            background: rgba(255,255,255,0.05);
            border-left: 3px solid var(--accent-gold);
            padding: 10px;
            margin-bottom: 8px;
            border-radius: 4px;
        }
    </style>
</head>
<body>

    <div class="container">
        
        <!-- Envio Manual de Diamantes -->
        <div class="card">
            <h3>💎 Envio Manual de Diamantes (ADM)</h3>
            <div class="form-group">
                <input type="text" id="adm-id-jogador" placeholder="ID do Jogador">
                <input type="number" id="adm-qtd-diamantes" placeholder="Quantidade">
            </div>
            <button class="btn btn-green" onclick="enviarDiamantesADM()">⚡ ENVIAR DIAMANTES</button>
        </div>

        <!-- Gestão de Usuários -->
        <div class="card">
            <h3>👥 Lista e Gestão de Usuários</h3>
            <div class="form-group">
                <input type="text" id="search-user" placeholder="Pesquisar por Nick ou ID...">
            </div>
            <div class="form-group" style="align-items: center;">
                <span id="user-found-name" style="font-weight: bold; flex: 1;">Aguardando busca...</span>
                <select id="ban-duration" style="flex: 0.8;">
                    <option value="7">Ban 7 Dias</option>
                    <option value="30">Ban 30 Dias</option>
                    <option value="365">Ban 1 Ano</option>
                </select>
                <button class="btn btn-danger" style="width: auto;" onclick="banirUsuario()">BANIR</button>
            </div>
        </div>

        <!-- Painel de Influenciadores -->
        <div class="card card-gold">
            <h3 class="gold-title">★ PAINEL ÚNICO: INFLUENCIADORES & PARCERIAS</h3>
            <p class="subtitle">Defina o influenciador, o cupom e envie tudo para o correio com um único clique.</p>

            <div class="form-group">
                <input type="text" id="inf-target" placeholder="Nick ou ID do Jogador">
                <input type="text" id="inf-cupom" placeholder="Cupom Personalizado (Ex: CAPUDO)">
            </div>

            <button class="btn btn-gold" onclick="salvarEEnviarInfluenciador()">★ SALVAR INFLUENCIADOR & ENVIAR CONVITE</button>

            <div id="lista-influenciadores">
                <!-- Influenciadores carregados dinamicamente -->
            </div>
        </div>

    </div>

    <script>
        // Configuração do Supabase (Substitua se necessário)
        const SUPABASE_URL = 'https://sua-url-supabase.supabase.co';
        const SUPABASE_KEY = 'sua-chave-anon-supabase';
        const supabase = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

        // Função auxiliar para buscar usuário por Nick ou ID
        async function buscarUsuario(termo) {
            termo = termo.trim();
            if (!termo) return null;

            // Busca por ID numérico ou Nick exato
            let { data, error } = await supabase
                .from('usuarios')
                .select('*')
                .or(`id.eq.${termo},nick.ilike.${termo}`)
                .maybeSingle();

            if (data) return data;

            // Se for apenas dígitos, assume o próprio ID informado
            if (/^\d+$/.test(termo)) {
                return { id: termo, nick: termo };
            }

            return null;
        }

        // 1. Envio Manual de Diamantes
        async function enviarDiamantesADM() {
            const idInput = document.getElementById('adm-id-jogador').value.trim();
            const qtd = parseInt(document.getElementById('adm-qtd-diamantes').value);

            if (!idInput || isNaN(qtd) || qtd <= 0) {
                alert('Preencha o ID e a quantidade corretamente!');
                return;
            }

            const user = await buscarUsuario(idInput);
            const idFinal = user ? user.id : idInput;

            const { error } = await supabase.from('correios').insert([
                {
                    id_jogador: String(idFinal),
                    titulo: '🎁 Recompensa Administrativa',
                    mensagem: `Você recebeu ${qtd} Diamantes enviados pela Administração!`,
                    tipo: 'diamantes',
                    codigo_cupom: null,
                    resgatado: false,
                    data: new Date().toLocaleDateString('pt-BR')
                }
            ]);

            if (error) {
                console.error(error);
                alert('Erro ao enviar diamantes: ' + error.message);
            } else {
                alert(`Sucesso! ${qtd} Diamantes enviados para o ID ${idFinal}.`);
                document.getElementById('adm-id-jogador').value = '';
                document.getElementById('adm-qtd-diamantes').value = '';
            }
        }

        // 2. Salvar Influenciador e Enviar Convite para o ID Correto
        async function salvarEEnviarInfluenciador() {
            const targetInput = document.getElementById('inf-target').value.trim();
            const cupom = document.getElementById('inf-cupom').value.trim().toUpperCase();

            if (!targetInput || !cupom) {
                alert('Informe o Nick/ID e o Cupom!');
                return;
            }

            // Busca a conta real no Supabase
            const user = await buscarUsuario(targetInput);
            
            if (!user) {
                alert('Jogador não encontrado no sistema!');
                return;
            }

            const idJogadorReal = String(user.id);

            // Grava na tabela de influenciadores
            const { error: infError } = await supabase.from('influenciadores').upsert([
                {
                    id_jogador: idJogadorReal,
                    cupom: cupom,
                    usos: 0,
                    comissao: 0.00
                }
            ]);

            if (infError) {
                console.error(infError);
                // Se der erro por falta da tabela de influenciadores, prossegue com o envio do correio
            }

            // Envia a mensagem direta para a conta do usuário
            const { error: mailError } = await supabase.from('correios').insert([
                {
                    id_jogador: idJogadorReal,
                    titulo: '⭐ Parceria de Influenciador Aprovada!',
                    mensagem: `Parabéns! Sua conta foi verificada como Influenciador Oficial. Seu cupom exclusivo é: ${cupom}`,
                    tipo: 'parceria',
                    codigo_cupom: cupom,
                    resgatado: false,
                    data: new Date().toLocaleDateString('pt-BR')
                }
            ]);

            if (mailError) {
                console.error(mailError);
                alert('Erro ao enviar carta no correio: ' + mailError.message);
            } else {
                alert(`Sucesso! Parceria ativada e convite enviado no correio para o ID: ${idJogadorReal}`);
                document.getElementById('inf-target').value = '';
                document.getElementById('inf-cupom').value = '';
                carregarInfluenciadores();
            }
        }

        // Carregar Lista de Influenciadores
        async function carregarInfluenciadores() {
            const container = document.getElementById('lista-influenciadores');
            const { data, error } = await supabase.from('influenciadores').select('*');

            if (error || !data) return;

            container.innerHTML = '';
            data.forEach(item => {
                const html = `
                    <div class="influencer-item">
                        <div class="influencer-header">${item.id_jogador} | Cupom: ${item.cupom}</div>
                        <div class="influencer-stats">Usos: ${item.usos || 0} | Comissões (30%): R$ ${(item.comissao || 0).toFixed(2)}</div>
                        <div class="influencer-actions">
                            <button class="btn-small-gold" onclick="resetarSaldo('${item.id_jogador}')">RESETAR SALDO</button>
                            <button class="btn-danger" onclick="removerInfluenciador('${item.id_jogador}')">REMOVER</button>
                        </div>
                    </div>
                `;
                container.innerHTML += html;
            });
        }

        // Inicialização
        window.onload = () => {
            carregarInfluenciadores();
        };
    </script>
</body>
</html>
