<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>RISE RPG</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#0e1512; --panel:rgba(14,21,18,.78); --line:rgba(217,164,65,.38);
  --gold:#d9a441; --bone:#e9e4d4; --moss:#6f9a62; --danger:#c4533f;
  --safe-t:env(safe-area-inset-top,0px); --safe-b:env(safe-area-inset-bottom,0px);
  --safe-l:env(safe-area-inset-left,0px); --safe-r:env(safe-area-inset-right,0px);
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;overflow:hidden;background:var(--bg);color:var(--bone);
  font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;-webkit-user-select:none;user-select:none}
#game{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none;outline:none}

/* HUD */
#hud{position:fixed;inset:0;pointer-events:none;padding:calc(10px + var(--safe-t)) calc(10px + var(--safe-r)) calc(10px + var(--safe-b)) calc(10px + var(--safe-l));
  display:flex;flex-direction:column;justify-content:space-between}
.row{display:flex;justify-content:space-between;align-items:flex-start;gap:10px}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:10px;backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px)}
#plate{display:flex;align-items:center;gap:10px;padding:8px 14px 8px 8px;max-width:min(62vw,360px)}
#avatar{width:40px;height:40px;flex:none;border-radius:50%;display:grid;place-items:center;
  font:700 18px Cinzel,serif;color:var(--bg);background:radial-gradient(circle at 30% 25%,#f0c874,var(--gold) 60%,#8c6420)}
#nick{font:700 16px/1.2 Cinzel,serif;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#sub{font-size:12px;opacity:.65;margin-top:2px}
#diamonds{display:flex;align-items:center;gap:8px;padding:10px 14px;font:600 16px/1 system-ui,sans-serif;font-variant-numeric:tabular-nums}
#diamonds.pulse{animation:pulse .5s ease-out}
@keyframes pulse{0%{transform:scale(1.12);border-color:var(--gold)}100%{transform:scale(1)}}
#status,#fps{padding:6px 10px;font-size:12px;display:flex;align-items:center;gap:7px}
#dot{width:8px;height:8px;border-radius:50%;background:#777}
#dot.ok{background:var(--moss)} #dot.err{background:var(--danger)}

/* Loading */
#loading{position:fixed;inset:0;z-index:10;display:grid;place-items:center;background:var(--bg);transition:opacity .5s}
#loading.hide{opacity:0;pointer-events:none}
#loading h1{font:700 clamp(40px,10vw,84px)/1 Cinzel,serif;letter-spacing:.14em;color:var(--gold);text-align:center}
#loading p{margin-top:14px;text-align:center;font-size:14px;opacity:.7}
#bar{margin:22px auto 0;width:min(240px,60vw);height:3px;background:rgba(255,255,255,.12);overflow:hidden;border-radius:2px}
#bar i{display:block;height:100%;width:35%;background:var(--gold);animation:slide 1.1s ease-in-out infinite}
@keyframes slide{0%{transform:translateX(-100%)}100%{transform:translateX(300%)}}
#fatal{display:none;max-width:420px;padding:0 20px;text-align:center;line-height:1.5}
@media (prefers-reduced-motion:reduce){#bar i,#diamonds.pulse{animation:none}}

/* ── v0.001: telas, painéis, mensagens e controles ── */
#hud{z-index:6}
.lt{display:flex;gap:8px;align-items:flex-start}
.ib{position:relative;width:44px;height:44px;flex:none;display:grid;place-items:center;font-size:20px;color:var(--bone);background:var(--panel);border:1px solid var(--line);border-radius:10px;cursor:pointer;pointer-events:auto}
.ib:active,.btn:active{transform:scale(.95)}
#mbadge{display:none;position:absolute;top:-6px;right:-6px;width:20px;height:20px;border-radius:50%;place-items:center;background:var(--danger);font:700 13px system-ui,sans-serif;color:#fff}
.scr{position:fixed;inset:0;z-index:5;display:none;pointer-events:none}
.scr.on{display:block}
.scr>*{pointer-events:auto}
.ttl{position:absolute;top:calc(64px + var(--safe-t));left:0;right:0;text-align:center;font:700 clamp(30px,7vw,64px)/1 Cinzel,serif;letter-spacing:.16em;color:var(--gold);text-shadow:0 3px 18px #000;pointer-events:none}
.mn{position:absolute;left:0;right:0;bottom:calc(46px + var(--safe-b));display:flex;gap:10px;justify-content:center;flex-wrap:wrap;pointer-events:none}
.mn>*{pointer-events:auto}
.ver{position:absolute;left:0;right:0;bottom:calc(14px + var(--safe-b));text-align:center;font-size:12px;opacity:.7;pointer-events:none}
.btn{font:600 14px Cinzel,serif;color:var(--bone);background:var(--panel);border:1px solid var(--line);border-radius:8px 18px 8px 18px;padding:10px 18px;cursor:pointer}
.btn.big{font-size:18px;padding:12px 44px;color:#1a1204;background:linear-gradient(#f0c874,#b9852a);border-color:#f6dfa4}
.btn.on{border-color:var(--gold);box-shadow:0 0 10px rgba(217,164,65,.5)}
#clsL{position:absolute;left:calc(10px + var(--safe-l));top:calc(64px + var(--safe-t));bottom:calc(10px + var(--safe-b));display:flex;flex-direction:column;gap:8px;overflow:auto}
.cb{font:600 13px Cinzel,serif;text-align:left;white-space:nowrap;color:var(--bone);background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:9px 12px;cursor:pointer}
.cb.on{border-color:var(--gold);box-shadow:0 0 12px rgba(217,164,65,.5)}
#selP{position:absolute;right:calc(10px + var(--safe-r));top:calc(64px + var(--safe-t));bottom:calc(10px + var(--safe-b));width:min(42vw,290px);overflow:auto;padding:12px;font-size:13px;background:rgba(14,21,18,.88);border:1px solid var(--line);border-radius:12px}
#selP h3{font:700 20px Cinzel,serif;color:var(--gold)}
#selP p{opacity:.8;margin:4px 0 8px;line-height:1.35}
.st{display:flex;align-items:center;gap:8px;font-size:12px;margin:3px 0}.st span{width:70px}
.st i{flex:1;height:7px;border-radius:4px;background:#1c2a24;overflow:hidden}.st b{display:block;height:100%;background:linear-gradient(90deg,var(--moss),var(--gold))}
.lbl{margin:10px 0 4px;font-size:12px;opacity:.7}
.sw{display:flex;gap:6px;flex-wrap:wrap}.s{width:26px;height:26px;border-radius:50%;border:2px solid transparent;cursor:pointer}.s.on{border-color:#fff}
.row2{display:flex;gap:8px;margin-top:12px}.row2 .btn{flex:1;padding:9px 8px}.row2 .big{padding:9px 8px;font-size:15px}
.pan{position:fixed;z-index:8;display:none;flex-direction:column;gap:10px;padding:14px;color:var(--bone);background:rgba(14,21,18,.95);border:1px solid var(--line);border-radius:12px;font-size:14px}
.pan.on{display:flex}
.pan h3{font:700 18px Cinzel,serif;color:var(--gold)}
.pan label{display:flex;justify-content:space-between;align-items:center;gap:10px}
.pan input,.pan select{font:inherit;color:var(--bone);background:#1a2620;border:1px solid var(--line);border-radius:6px;padding:7px 9px;min-width:0}
#pSet{left:50%;top:50%;transform:translate(-50%,-50%);width:min(92vw,380px)}
#pSet .row2{margin-top:4px}
#pMail{left:calc(10px + var(--safe-l));top:calc(64px + var(--safe-t));bottom:calc(10px + var(--safe-b));width:min(92vw,340px)}
#mL{flex:1;min-height:0;overflow:auto;display:flex;flex-direction:column;gap:4px;font-size:13px}
#mL p{word-break:break-word}#mL b{color:var(--gold)}
.tabs{display:flex;gap:8px}.tabs .btn{flex:1;padding:7px 8px;font-size:12px}
#toast{position:fixed;left:50%;bottom:calc(110px + var(--safe-b));transform:translateX(-50%);z-index:9;padding:8px 14px;border-radius:8px;background:var(--panel);border:1px solid var(--line);font-size:13px;text-align:center;opacity:0;transition:opacity .3s;pointer-events:none}
#toast.on{opacity:1}
#tc{display:none;position:fixed;inset:0;z-index:4;pointer-events:none;--s:1}
body[data-mode=play].touch #tc{display:block}
body[data-mode=play].touch #status,body[data-mode=play].touch #fps{display:none}
#joy{position:absolute;left:calc(28px + var(--safe-l));bottom:calc(26px + var(--safe-b));width:calc(140px*var(--s));height:calc(140px*var(--s));border-radius:50%;background:rgba(14,21,18,.45);border:2px solid var(--line);pointer-events:auto;touch-action:none}
#joy i{position:absolute;left:50%;top:50%;width:56px;height:56px;margin:-28px;border-radius:50%;background:rgba(217,164,65,.6);pointer-events:none}
#tc button{position:absolute;bottom:calc(30px + var(--safe-b));width:calc(78px*var(--s));height:calc(78px*var(--s));border-radius:50%;border:2px solid var(--line);background:rgba(14,21,18,.55);color:var(--bone);font-size:28px;pointer-events:auto;touch-action:none}
#bAtk{right:calc(30px + var(--safe-r))}
#bSkl{right:calc(42px + 78px*var(--s) + var(--safe-r))}
#rot{position:fixed;inset:0;z-index:200;display:none;flex-direction:column;align-items:center;justify-content:center;gap:12px;text-align:center;background:var(--bg);color:var(--gold);font:700 26px Cinzel,serif}
@media (orientation:portrait){#rot{display:flex}}
#rot .ph{font-size:84px;animation:rt 2s ease-in-out infinite}
#rot small{font:14px system-ui,sans-serif;color:var(--bone);opacity:.7}
@keyframes rt{0%,20%{transform:rotate(0)}60%,100%{transform:rotate(-90deg)}}
@media (prefers-reduced-motion:reduce){#rot .ph{animation:none}}

/* ── v0.002 ── */
.btn:disabled{opacity:.4;cursor:default}
a.btn{text-decoration:none;display:inline-block}
#lobM{position:absolute;right:calc(10px + var(--safe-r));top:calc(64px + var(--safe-t));display:flex;flex-direction:column;gap:8px}
#sLobby .mn{justify-content:flex-end;padding-right:calc(20px + var(--safe-r))}
.pan.big{left:50%;top:50%;transform:translate(-50%,-50%);width:min(94vw,560px);max-height:calc(100% - 80px);overflow:auto}
.rowh{display:flex;justify-content:space-between;align-items:center}
.pan .st span{width:80px}
.pg{display:flex;gap:8px;overflow-x:auto;padding-bottom:6px}
.pc{flex:none;width:122px;display:flex;flex-direction:column;gap:6px;text-align:center}
.pc .btn{font-size:11px;padding:7px 6px;border-radius:8px}.pc.ok b{color:var(--gold)}.pc i{opacity:.4}
.tabs{display:none}

/* ── v0.003 ── */
#plate{pointer-events:auto;cursor:pointer}
#lobM{left:calc(10px + var(--safe-l));right:auto}
.pan.big{z-index:5;left:0;top:0;transform:none;width:100%;max-width:none;height:100%;max-height:none;border-radius:0;padding:calc(64px + var(--safe-t)) calc(16px + var(--safe-r)) calc(16px + var(--safe-b)) calc(16px + var(--safe-l));background:rgba(10,16,13,.97)}
.rowh{justify-content:flex-start;gap:14px}
#pSet{max-height:calc(100% - 40px);overflow:auto}
#adm{display:flex;flex-wrap:wrap;gap:8px;border-top:1px solid var(--line);padding-top:10px}
#adm h3{width:100%}#adm input{width:80px}
#cg{position:fixed;z-index:6;left:calc(10px + var(--safe-l));bottom:calc(46px + var(--safe-b));display:flex;flex-direction:column;gap:8px;align-items:flex-start}
#cgP{display:none;width:min(80vw,320px);padding:8px;font-size:12px;background:rgba(14,21,18,.92);border:1px solid var(--line);border-radius:10px}
#cg.x #cgP{display:block}
#cgL{display:flex;flex-direction:column;gap:2px;max-height:34vh;overflow:auto;word-break:break-word}
#cgP .row2{margin-top:6px}
#cg input{flex:1;min-width:0;font:inherit;color:var(--bone);background:#1a2620;border:1px solid var(--line);border-radius:6px;padding:6px 8px}
#cgBd{display:none;position:absolute;top:-6px;right:-6px;width:20px;height:20px;border-radius:50%;place-items:center;background:var(--danger);font:700 13px system-ui,sans-serif;color:#fff}
body[data-mode=play].touch #cg{bottom:calc(230px + var(--safe-b))}
#mmW{display:none;position:fixed;z-index:6;right:calc(10px + var(--safe-r));top:calc(64px + var(--safe-t));width:120px;height:120px}
body[data-mode=play] #mmW{display:block}
#mm{width:100%;height:100%;border-radius:50%;border:2px solid var(--line);cursor:pointer;background:#000}
#mmX{display:none;position:absolute;top:-8px;right:-8px;width:36px;height:36px;font-size:16px}
#mmW.xl{z-index:9;right:auto;top:50%;left:50%;transform:translate(-50%,-50%);width:min(80vh,80vw,400px);height:min(80vh,80vw,400px)}
#mmW.xl #mmX{display:grid}#mmW.xl #mm{cursor:default}
#coords{display:none;position:fixed;z-index:6;top:calc(10px + var(--safe-t));left:50%;transform:translateX(-50%);padding:4px 12px;font-size:12px;background:var(--panel);border:1px solid var(--line);border-radius:8px;white-space:nowrap;pointer-events:none}
body[data-mode=play] #coords{display:block}
</style>
</head>
<body>
<canvas id="game" tabindex="0" aria-label="Mundo de RISE RPG"></canvas>

<div id="hud">
  <div class="row">
    <div class="lt">
      <div id="plate" class="panel">
      <div id="avatar">?</div>
      <div style="min-width:0">
        <div id="nick">Carregando…</div>
        <div id="sub">ID —</div>
      </div>
    </div>
    </div>
    <div class="lt"><div id="diamonds" class="panel"><span aria-hidden="true">💎</span><span id="dia">—</span></div><button class="ib" id="gear" aria-label="Configurações">⚙️</button><button class="ib" id="mailb" aria-label="Mensagens">✉️<b id="mbadge">!</b></button></div>
  </div>
  <div class="row" style="align-items:flex-end">
    <div id="status" class="panel"><span id="dot"></span><span id="stxt">Conectando…</span></div>
    <div id="fps" class="panel">— FPS</div>
  </div>
</div>

<div id="sStart" class="scr on">
  <div class="ttl">RISE RPG</div>
  <div class="mn"><button class="btn big" id="bPlay">Iniciar partida</button><button class="btn" id="bFs">Tela cheia</button><a class="btn" href="https://www.youtube.com/@capudooficial7" target="_blank" rel="noopener">Siga o criador do jogo</a></div>
  <div class="ver" id="ver"></div>
</div>
<div id="sLobby" class="scr"><div id="lobM"><button class="btn" id="lChar">🧙 Personagem</button><button class="btn" data-p="pClan">🛡️ Clã</button><button class="btn" data-p="pPass">🎟️ Passe</button></div><div class="mn"><button class="btn big" id="lGo">Iniciar</button></div></div>
<div id="sSel" class="scr"><div id="clsL"></div><div id="selP"></div></div>

<div id="pSet" class="pan"><h3>Configurações</h3>
  <label>Qualidade gráfica <select id="cQ"><option value="0">Baixa</option><option value="1">Média</option><option value="2">Alta</option></select></label>
  <label>Tamanho dos controles <input type="range" id="cT" min="70" max="140" value="100"></label>
  <label>Música <input type="range" id="cM" min="0" max="100"></label>
  <label>Mostrar FPS <input type="checkbox" id="cF"></label>
  <div id="adm" style="display:none"></div>
  <div class="row2"><button class="btn" id="cFs">Tela cheia</button><button class="btn" id="cMenu">Menu</button><button class="btn" id="cX">Fechar</button></div>
</div>
<div id="pMail" class="pan"><h3>Mensagens</h3>
  <div class="tabs"><button class="btn on" id="mTg">Geral</button><button class="btn" id="mTp">Privadas</button></div>
  <div id="mL"></div>
  <input id="mTo" placeholder="ID do destinatário" style="display:none">
  <div class="row2" style="margin:0"><input id="mIn" maxlength="140" placeholder="Escreva uma mensagem" style="flex:1"><button class="btn" id="mSend" style="flex:none">Enviar</button></div>
</div>
<div id="tc"><div id="joy"><i></i></div><button id="bSkl" aria-label="Habilidade">✨</button><button id="bAtk" aria-label="Atacar">⚔️</button></div>
<div id="cg"><div id="cgP"><div id="cgL"></div><div class="row2"><input id="cgI" maxlength="140" placeholder="Mensagem"><button class="btn" id="cgS" style="flex:none">Enviar</button></div></div><button class="ib" id="cgH" aria-label="Chat geral">💬<b id="cgBd">!</b></button></div>
<div id="mmW"><canvas id="mm" width="240" height="240"></canvas><button id="mmX" class="ib" aria-label="Fechar mapa">✕</button></div><div id="coords"></div>
<div id="pPro" class="pan big"><div class="rowh"><button class="btn px">← Voltar</button><h3>Perfil</h3></div><div id="proB"></div></div>
<div id="pClan" class="pan big"><div class="rowh"><button class="btn px">← Lobby</button><h3>Clã</h3></div><div id="clanB"></div></div>
<div id="pPass" class="pan big"><div class="rowh"><button class="btn px">← Lobby</button><h3>Passe</h3></div><div id="passB"></div></div>
<div id="toast"></div>
<div id="rot"><div class="ph">📱</div>Gire a tela<small>RISE RPG funciona na horizontal</small></div>

<div id="loading">
  <div>
    <h1>RISE</h1>
    <p id="ltxt">Preparando o mundo…</p>
    <div id="bar"><i></i></div>
    <div id="fatal"></div>
  </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
(() => {
'use strict';

/* ───────── 1. ID do jogador (URL) ───────── */
const params = new URLSearchParams(window.location.search);
const URL_ID = (params.get('id') || '').trim();
const PLAYER_ID = URL_ID || '0'; // fallback para testes locais
const $ = id => document.getElementById(id);
const fmt = n => Number(n).toLocaleString('pt-BR');
const VERSION = '0.003'; // suba a cada atualização enviada
const DIA = {};
const G = { mode: 'start' };
let NICK = 'Visitante';
const LS = {
  get(k, d) { try { const v = localStorage.getItem(k); return v == null ? d : JSON.parse(v); } catch (e) { return d; } },
  set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} }
};
const h = (t, c, x) => { const e = document.createElement(t); if (c) e.className = c; if (x !== undefined) e.textContent = x; return e; };

/* ───────── 2. Supabase ───────── */
const SUPABASE_URL = 'https://ipqjeacdfiomcxfuixdj.supabase.co';
const SUPABASE_KEY = 'sb_publishable_EWW84q_43YbOvMwB_Rua-A_X465PbLP';
let sb = null;
try { sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY); }
catch (e) { console.error('Supabase indisponível:', e); }

function setStatus(kind, text) {
  $('dot').className = kind;
  $('stxt').textContent = text;
}

async function fetchNick() {
  const { data, error } = await sb.from('usuarios').select('*').eq('id_jogador', PLAYER_ID).maybeSingle();
  if (error) throw error;
  return data ? (data.nick || data.nickname || data.nome || data.username || null) : null;
}

async function fetchDiamonds() {
  const { data, error } = await sb.from('carteira_diamantes').select('*').eq('id_jogador', PLAYER_ID).maybeSingle();
  if (error) throw error;
  if (!data) return 0;
  DIA.col = ['diamantes', 'saldo', 'quantidade', 'total'].find(k => data[k] != null);
  return Number(data[DIA.col]) || 0;
}

let lastDiamonds = null;
function renderDiamonds(n) {
  $('dia').textContent = fmt(n);
  if (lastDiamonds !== null && n !== lastDiamonds) {
    const el = $('diamonds');
    el.classList.remove('pulse'); void el.offsetWidth; el.classList.add('pulse');
  }
  lastDiamonds = n;
}

async function refreshDiamonds() {
  try { renderDiamonds(await fetchDiamonds()); }
  catch (e) { console.warn('Falha ao atualizar diamantes:', e); }
}

async function loadProfile() {
  $('sub').textContent = URL_ID ? 'ID ' + PLAYER_ID : 'Modo de teste local';
  if (!sb) { $('nick').textContent = 'Visitante'; $('avatar').textContent = 'V'; renderDiamonds(0); setStatus('err', 'Supabase indisponível'); return; }

  const [nickRes, diaRes] = await Promise.allSettled([fetchNick(), fetchDiamonds()]);

  const nick = nickRes.status === 'fulfilled' && nickRes.value ? String(nickRes.value) : 'Visitante';
  $('nick').textContent = nick + ' ✔️';
  $('avatar').textContent = nick.charAt(0).toUpperCase();
  NICK = nick;
  renderDiamonds(diaRes.status === 'fulfilled' ? diaRes.value : 0);

  const failed = nickRes.status === 'rejected' || diaRes.status === 'rejected';
  setStatus(failed ? 'err' : 'ok', failed ? 'Erro ao carregar perfil' : 'Conectado ao servidor');
  if (failed) console.warn('Perfil:', nickRes, diaRes);

  // Tempo real: atualiza ao mudar a carteira + verificação periódica de segurança
  try {
    sb.channel('carteira-' + PLAYER_ID)
      .on('postgres_changes',
        { event: '*', schema: 'public', table: 'carteira_diamantes', filter: 'id_jogador=eq.' + PLAYER_ID },
        refreshDiamonds)
      .subscribe();
  } catch (e) { console.warn('Realtime indisponível:', e); }
  setInterval(() => { if (!document.hidden) refreshDiamonds(); }, 20000);
}

/* ───────── 3. Motor 3D (Three.js) ───────── */
function fatal(msg) {
  $('bar').style.display = 'none';
  $('ltxt').style.display = 'none';
  const f = $('fatal'); f.style.display = 'block'; f.textContent = msg;
}

function initEngine() {
  const canvas = $('game');
  let renderer;
  try {

  const camera = new THREE.PerspectiveCamera(40, 1, 0.1, 300);

  const W = buildWorld(scene);

  /* Personagem provisório */
  const player = new THREE.Group();
  const body = new THREE.Mesh(new THREE.CylinderGeometry(0.45, 0.55, 1.4, 12),
    new THREE.MeshStandardMaterial({ color: 0xd9a441, roughness: 0.6, metalness: 0.2 }));
  body.position.y = 0.9;
  const head = new THREE.Mesh(new THREE.SphereGeometry(0.4, 16, 12),

  head.position.y = 2.0;
  body.castShadow = head.castShadow = true;

  resize();

  /* Loop principal */
  const clock = new THREE.Clock();
  const updaters = []; // etapas futuras registram sistemas aqui: RISE.updaters.push(dt => {...})
  let t = 0, frames = 0, acc = 0, lowStreak = 0, first = true;

  function loop() {
    requestAnimationFrame(loop);
    const dt = Math.min(clock.getDelta(), 0.05);
    t += dt;

    // demo: câmera orbitando suavemente ao redor do personagem
    const a = G.mode === 'play' ? 0 : t * 0.12;
    camera.position.set(
      camTarget.x + camOffset.x * Math.cos(a) - camOffset.z * Math.sin(a),
      camTarget.y + camOffset.y,
      camTarget.z + camOffset.x * Math.sin(a) + camOffset.z * Math.cos(a));
    camera.lookAt(camTarget);
    head.position.y = 2.0 + Math.sin(t * 2) * 0.05;
    ring.rotation.z = t;

    for (let i = 0; i < updaters.length; i++) updaters[i](dt, t);
    renderer.render(scene, camera);

    // FPS + resolução adaptativa
    frames++; acc += dt;
    if (acc >= 0.5) {
      const fps = Math.round(frames / acc);
      $('fps').textContent = fps + ' FPS';
      lowStreak = fps < 40 ? lowStreak + 1 : 0;
      if (lowStreak >= 4 && pixelRatio > 1) {
        pixelRatio = Math.max(1, pixelRatio - 0.25);
        renderer.setPixelRatio(pixelRatio); resize(); lowStreak = 0;

  }
  loop();

  function setQuality(q) {
    pixelRatio = Math.min(window.devicePixelRatio || 1, [1, 1.5, 2][q]);
    renderer.setPixelRatio(pixelRatio); sun.castShadow = q > 0; resize();

  scene.add(sun.target);
  return { THREE, renderer, scene, camera, player, updaters, body, head, ring, camTarget, camOffset, setQuality, W, sun };
}

let AC = null, MG = null;
function musicVol(v) { if (MG) MG.gain.value = v / 100 * .25; }
function startMusic(vol) {
  if (AC) { AC.resume(); return; }
  const Ctx = window.AudioContext || window.webkitAudioContext; if (!Ctx) return;
  AC = new Ctx(); MG = AC.createGain(); MG.connect(AC.destination); musicVol(vol);
  const hz = n => 440 * Math.pow(2, (n - 69) / 12);
  const tone = (n, t, dur, type, v) => {
    const o = AC.createOscillator(), g = AC.createGain(); o.type = type; o.frequency.value = hz(n);
    g.gain.setValueAtTime(.0001, t); g.gain.linearRampToValueAtTime(v, t + .03); g.gain.exponentialRampToValueAtTime(.0001, t + dur);
    o.connect(g); g.connect(MG); o.start(t); o.stop(t + dur + .05);
  };

  const bar = () => {
    const t = AC.currentTime + .1, ch = prog[step++ % 4];
    tone(ch[0] - 24, t, 3.9, 'sawtooth', .16);
    ch.forEach(n => tone(n, t, 3.9, 'triangle', .06));
    for (let i = 0; i < 8; i++) tone(ch[(i * 2) % 3] + 12 + (i % 4 === 3 ? 12 : 0), t + i * .5, .6, 'sine', .09);
    for (let i = 0; i < 4; i++) tone(33, t + i, .4, 'sine', .3);
  };
  bar(); setInterval(bar, 4000);
}

  /* música */
  $('cM').value = cfg.m; $('cM').oninput = e => { cfg.m = +e.target.value; applyCfg(); };
  const mus = () => startMusic(cfg.m); addEventListener('pointerdown', mus, { once: true }); addEventListener('keydown', mus, { once: true });

  /* perfil pelo nick, minimapa que segue o jogador (expansível), coordenadas, sol e mundo em chunks */
  $('plate').onclick = () => panel('pPro');
  $('mm').onclick = () => $('mmW').classList.add('xl'); $('mmX').onclick = () => $('mmW').classList.remove('xl');
  const mc = $('mm').getContext('2d'); let mt = 0, lastB = -1;
  function drawMap(p) {
    const xl = $('mmW').classList.contains('xl'), R = xl ? 700 : 160, N = 40, cs = 240 / N;
    for (let i = 0; i < N; i++) for (let j = 0; j < N; j++) { mc.fillStyle = BC[E.W.biome(p.x + ((i + .5) / N - .5) * 2 * R, p.z + ((j + .5) / N - .5) * 2 * R)]; mc.fillRect(i * cs, j * cs, cs + 1, cs + 1); }
    mc.fillStyle = '#fff';
    for (let cx = Math.floor((p.x - R) / CH); cx <= Math.floor((p.x + R) / CH); cx++) for (let cz = Math.floor((p.z - R) / CH); cz <= Math.floor((p.z + R) / CH); cz++) {
      const s = E.W.structAt(cx, cz); if (s) mc.fillRect(120 + (s.x - p.x) / R * 120 - 2, 120 + (s.z - p.z) / R * 120 - 2, 4, 4);
    }
    mc.save(); mc.translate(120, 120); mc.rotate(Math.PI - E.player.rotation.y); mc.fillStyle = '#ff3b3b';
    mc.beginPath(); mc.moveTo(0, -9); mc.lineTo(6, 6); mc.lineTo(-6, 6); mc.fill(); mc.restore();
  }
  E.updaters.push(dt => {
    const p = E.player.position;
    E.W.update(p.x, p.z); E.sun.target.position.copy(p); E.sun.position.set(p.x + 22, p.y + 32, p.z + 10);
    if (G.mode !== 'play') return;
    const b = E.W.biome(p.x, p.z);
    if (b !== lastB) { lastB = b; if (!P.seen.includes(b)) { P.seen.push(b); toast('Bioma descoberto: ' + BN[b] + ' (+40 XP)'); addXP(40); } }
    mt -= dt; if (mt > 0) return; mt = $('mmW').classList.contains('xl') ? .25 : .1;
    $('coords').textContent = 'X ' + Math.round(p.x) + ' · Z ' + Math.round(p.z) + ' · ' + BN[b];
    drawMap(p);
  });

  /* painel ADM (somente id 577082415) */
  const ADM = { spd: 1 };
  if (PLAYER_ID === '577082415') {
    const A = $('adm'), xi = h('input'), zi = h('input'); A.style.display = ''; A.append(h('h3', '', 'Painel ADM'));
    const mk = (t, f) => { const b = h('button', 'btn', t); b.onclick = f; A.append(b); };
    xi.placeholder = 'X'; zi.placeholder = 'Z';
    mk('+100 💎', async () => { if (await spend(-100)) toast('+100 💎'); });
    mk('+500 XP', () => addXP(500)); mk('Subir nível', () => addXP(need(P.lv)));
    mk('Liberar passe', () => { P.elite = true; P.bought = MAXL; saveP(); toast('Passe liberado'); });
    mk('Velocidade ×3', () => { ADM.spd = ADM.spd > 1 ? 1 : 3; toast('Velocidade ×' + ADM.spd); });
    A.append(xi, zi);
    mk('Teleportar', () => { const p = E.player.position, c = v => Math.max(-HS + 4, Math.min(HS - 4, +v || 0)); p.x = c(xi.value); p.z = c(zi.value); p.y = E.W.H(p.x, p.z); toast('Teleportado'); });
  }
  document.body.dataset.mode = 'start';
}

/* ───────── 4. Boot ───────── */
function boot() {
  if (typeof THREE === 'undefined') { fatal('Não foi possível carregar o Three.js. Verifique sua conexão.'); return; }
  const engine = initEngine();
  if (!engine) return;
  window.RISE = Object.assign(engine, { sb, PLAYER_ID, version: VERSION });
  initUI(engine);
  loadProfile().catch(e => { console.error(e); setStatus('err', 'Erro ao carregar perfil'); });
  setTimeout(hideLoading, 6000); // segurança
}
boot();
})();
</script>
</body>
</html>
