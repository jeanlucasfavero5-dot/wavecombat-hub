<!DOCTYPE html>
<html lang="pt-BR"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Street Soccer</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script src="https://cdn.socket.io/4.7.5/socket.io.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<style>
*{box-sizing:border-box;margin:0;-webkit-tap-highlight-color:transparent}
:root{--n1:#c6ff00;--n2:#00e5ff;--n3:#ff2e93;--shirt:#00e5ff;--short:#2b2f6b;--shoe:#ff2e93;--cap:#c6ff00;--hair:#2b1b12;--ball:#fff;--lens:#111;--gb:#ffffff30}
html,body{height:100%;overflow:hidden;background:#0b0620;color:#fff;font-family:'Trebuchet MS',system-ui,sans-serif;user-select:none}
button{font-family:inherit}
.scr{position:fixed;inset:0;display:none}
.scr.on{display:flex;animation:fi .5s}
@keyframes fi{from{opacity:0}}
.bg{position:absolute;inset:0;z-index:-1;overflow:hidden;background:radial-gradient(60% 50% at 15% 10%,#ff2e9360,transparent),radial-gradient(50% 50% at 90% 15%,#00e5ff50,transparent),linear-gradient(#1c0a44,#0b0620)}
.bg:after{content:"";position:absolute;left:-60%;right:-60%;bottom:-5%;height:50%;background:repeating-linear-gradient(90deg,#ffffff26 0 2px,transparent 2px 80px),repeating-linear-gradient(0deg,#ffffff26 0 2px,transparent 2px 44px);transform:perspective(320px) rotateX(58deg);transform-origin:bottom;-webkit-mask:linear-gradient(transparent,#000);mask:linear-gradient(transparent,#000)}
.tag{position:absolute;left:50%;top:34%;transform:translate(-50%,-50%) rotate(-8deg);font:900 20vw/1 Impact,'Arial Black',sans-serif;-webkit-text-stroke:2px #ffffff1c;color:transparent;white-space:nowrap}
.g{background:#ffffff17;border:1px solid var(--gb);border-radius:22px;-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px)}
.btn{border:0;border-radius:999px;padding:14px 34px;font-weight:900;font-size:18px;color:#10002b;background:linear-gradient(135deg,var(--n1),#7dff6b);box-shadow:0 8px 0 #4a8f00,0 14px 30px #c6ff0066;cursor:pointer;transition:.15s}
.btn:active{transform:translateY(5px);box-shadow:0 3px 0 #4a8f00}
.btn.sm{padding:7px 16px;font-size:14px;box-shadow:0 4px 0 #4a8f00}
.pulse{animation:pls 1.2s infinite}
@keyframes pls{50%{transform:scale(1.08);filter:brightness(1.2)}}
#splash{flex-direction:column;align-items:center;justify-content:center;gap:20px;text-align:center}
.ball{font-size:64px;animation:bn .6s infinite alternate cubic-bezier(.3,0,.6,1)}
@keyframes bn{from{transform:translateY(-36px) rotate(0)}to{transform:translateY(6px) rotate(180deg)}}
.logo{font:900 clamp(52px,13vw,130px)/.88 Impact,'Arial Black',sans-serif;text-transform:uppercase;transform:rotate(-4deg);background:linear-gradient(90deg,var(--n1),var(--n2),var(--n3));-webkit-background-clip:text;background-clip:text;color:transparent;filter:drop-shadow(0 6px 0 #000a) drop-shadow(0 0 26px #00e5ff77);animation:pop 1s cubic-bezier(.2,1.6,.4,1) both}
.logo small{display:block;margin-top:10px;font:700 .24em 'Trebuchet MS',sans-serif;letter-spacing:.2em;-webkit-text-fill-color:#fff;text-transform:none}
@keyframes pop{from{transform:scale(.2) rotate(-30deg);opacity:0}}
.ld{width:min(260px,70vw);height:10px;border-radius:9px;background:#ffffff22;overflow:hidden}
.ld i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--n1),var(--n2),var(--n3));animation:ld 1.5s forwards}
@keyframes ld{to{width:100%}}
.ver{position:absolute;right:18px;bottom:calc(14px + env(safe-area-inset-bottom));font-weight:800;opacity:.7;letter-spacing:.1em}
#lobby{flex-direction:column}
.top{display:flex;gap:10px;align-items:center;padding:calc(10px + env(safe-area-inset-top)) 14px 6px}
.chip{display:flex;align-items:center;gap:8px;padding:8px 16px;border-radius:999px;font-weight:800}
.pf{width:44px;height:44px;border-radius:50%;display:grid;place-items:center;background:linear-gradient(135deg,var(--n3),#7c4dff);font:900 22px Impact,sans-serif}
.adm{background:var(--n1);color:#10002b;border-radius:8px;padding:1px 6px;font-size:11px;font-weight:900;font-style:normal;margin-left:6px}
.dot{width:12px;height:12px;border-radius:50%;background:#ff5252;box-shadow:0 0 10px #ff5252}
.dot.ok{background:#69f0ae;box-shadow:0 0 10px #69f0ae}
.mid{flex:1;min-height:0;position:relative;display:flex;align-items:center;justify-content:center}
.side{position:absolute;left:12px;top:50%;transform:translateY(-50%);display:flex;flex-direction:column;gap:10px;padding:10px;z-index:2}
.tab{width:64px;height:64px;border-radius:20px;border:0;background:#ffffff14;color:#fff;font-size:11px;font-weight:800;display:flex;flex-direction:column;align-items:center;justify-content:center;cursor:pointer;transition:.15s}
.tab b{font-size:24px}
.tab:hover{background:#ffffff30;transform:scale(1.08)}
.squad{position:absolute;right:14px;top:50%;transform:translateY(-50%);display:flex;flex-direction:column;gap:12px;z-index:2}
.slot{width:62px;height:62px;border-radius:50%;border:2px dashed var(--gb);background:#ffffff12;color:#fff;font-size:28px;cursor:pointer}
.slot.me{border:2px solid var(--n1);cursor:default}
#av{height:92%;max-width:60%;animation:fl 3s ease-in-out infinite;filter:drop-shadow(0 20px 30px #0008)}
@keyframes fl{50%{transform:translateY(-8px)}}
.bl{animation:bl 1s infinite ease-in-out}
@keyframes bl{50%{transform:translateY(-24px)}}
.bot{display:flex;align-items:center;justify-content:center;gap:14px;padding:8px 14px calc(14px + env(safe-area-inset-bottom))}
#modal{position:fixed;inset:0;display:none;align-items:center;justify-content:center;background:#000b;z-index:9;padding:14px}
#modal.on{display:flex}
#modal.r{background:transparent;justify-content:flex-end;pointer-events:none}
#modal.r .box{pointer-events:auto;width:min(380px,100%);height:100%}
.box{width:min(880px,100%);max-height:100%;display:flex;flex-direction:column;background:linear-gradient(#2a1460f2,#140834f2);animation:pop2 .25s both}
@keyframes pop2{from{transform:scale(.92) translateY(20px);opacity:0}}
.hd{display:flex;align-items:center;justify-content:space-between;padding:14px 18px;font:900 24px Impact,'Arial Black',sans-serif;letter-spacing:.03em}
.x{width:40px;height:40px;border-radius:50%;border:0;background:#ffffff22;color:#fff;font-size:18px;cursor:pointer}
.bd{padding:4px 18px 18px;overflow:auto}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:12px}
.card{padding:12px;border-radius:18px;background:#ffffff12;border:1px solid var(--gb);text-align:center;display:flex;flex-direction:column;gap:6px;align-items:center}
.card.sel{border-color:var(--n1);box-shadow:0 0 18px #c6ff0055}
.e{font-size:40px}
.pills{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}
.pill{border:0;border-radius:999px;padding:9px 16px;background:#ffffff1c;color:#fff;font-weight:800;cursor:pointer}
.pill.on{background:var(--n2);color:#001a22}
.sw{width:38px;height:38px;border-radius:50%;border:3px solid #ffffff55;cursor:pointer;color:#fff;font-weight:900}
.sw.on{border-color:#fff;transform:scale(1.18);box-shadow:0 0 14px #fff8}
.bar{height:10px;border-radius:9px;background:#ffffff22;overflow:hidden;margin-top:6px;width:100%}
.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--n1),var(--n2))}
input{width:100%;padding:10px 14px;margin:4px 0 8px;border-radius:14px;border:1px solid var(--gb);background:#ffffff14;color:#fff;font-size:16px}
pre{background:#0006;border-radius:14px;padding:12px;margin-top:10px;white-space:pre-wrap;font-size:13px}
#toast{position:fixed;left:50%;bottom:90px;transform:translate(-50%,30px);opacity:0;padding:12px 22px;border-radius:999px;background:#000c;border:1px solid var(--gb);font-weight:800;z-index:20;transition:.25s;pointer-events:none;white-space:nowrap}
#toast.on{opacity:1;transform:translate(-50%,0)}
@media(max-height:520px){.tab{width:46px;height:46px}.tab span{display:none}.side{gap:6px;padding:6px}.slot{width:46px;height:46px}}
@media(prefers-reduced-motion:reduce){*{animation:none!important}}
#splash{gap:min(3vh,18px)}
.logo{font-size:min(11vw,19vh);line-height:.9;white-space:nowrap}
#go{visibility:hidden;padding:min(2.4vh,14px) 40px}
#go.on{visibility:visible}
.inf{position:absolute;left:18px;bottom:calc(14px + env(safe-area-inset-bottom));line-height:1.3}
.inf small{opacity:.75;letter-spacing:.06em}
@keyframes fl{50%{transform:scale(1.012)}}
#av{transform-origin:50% 100%}
#rot{position:fixed;inset:0;z-index:99;display:none;flex-direction:column;align-items:center;justify-content:center;gap:16px;background:#0b0620;text-align:center;padding:24px;line-height:1.4}
#rot i{font-size:84px;font-style:normal;animation:rt 2.4s ease-in-out infinite}
@keyframes rt{0%,25%{transform:rotate(0)}65%,100%{transform:rotate(-90deg)}}
@media(orientation:portrait){#rot{display:flex}}
#gl3d{position:fixed;inset:0;width:100%;height:100%;z-index:0;display:block}
body.gl .bg{display:none}
#splash{background:linear-gradient(#0b0620cc,#0b062040 55%,#0b0620cc)}
#lobby{touch-action:none;background:linear-gradient(#0b0620b0,transparent 20%,transparent 72%,#0b0620b0)}
#gear{position:fixed;top:calc(10px + env(safe-area-inset-top));right:14px;z-index:30;width:46px;height:46px;border-radius:50%;color:#fff;font-size:22px;cursor:pointer;display:grid;place-items:center;padding:0;transition:.3s}
#gear:hover{transform:rotate(60deg)}
.top{padding-right:72px}.hd{padding-right:70px}
@media(max-width:700px){.bot .pill{padding:10px 12px!important;font-size:13px}.bot .btn{padding:12px 22px}}
</style></head><body>

<canvas id="gl3d"></canvas>
<div id="splash" class="scr on"><div class="bg"><b class="tag">STREET KINGS</b></div>
<h1 class="logo">Street Soccer<small>Futebol de rua 3v3</small></h1>
<div class="ld" id="ld"><i></i></div>
<button class="btn pulse" id="go">▶ INICIAR JOGO</button>
<button class="pill g" id="fs" onclick="tela()">⛶ Expandir tela inteira</button>
<div class="inf"><b id="sn"></b><br><small id="si"></small></div>
<div class="ver" id="ver"></div></div>

<div id="lobby" class="scr"><div class="bg"><b class="tag">STREET KINGS</b></div>
<div class="top"><div class="g chip" style="padding:6px 18px 6px 6px"><span class="pf" id="pi"></span><div><b id="pn"></b><i class="adm" id="pa" hidden>ADM</i><br><small id="pid"></small></div></div>
<i class="dot" id="net"></i><span style="flex:1"></span>
<div class="g chip">💎 <b id="dia">…</b></div><div class="g chip">🪙 <b id="gold">1.250</b></div></div>
<div class="mid"><div class="side g" id="tabs"></div>
<div class="squad"><div class="slot me">⭐</div><button class="slot" onclick="abrir('soc')">+</button><button class="slot" onclick="abrir('soc')">+</button></div></div>
<div class="bot"><button class="pill g" style="padding:14px 22px" onclick="abrirTime()">🛡️ Time</button><button class="pill g" id="bm" style="padding:14px 22px"></button><button class="btn" id="play">⚽ JOGAR</button><button class="pill g" style="padding:14px 22px" onclick="abrir('passe')">🎟️ Passe</button></div></div>

<div id="modal"><div class="box g"><div class="hd"><span id="mt"></span><button class="x" onclick="fechar()">✕</button></div><div class="bd" id="mb"></div></div></div>
<button id="gear" class="g" onclick="abrir('cfg')">⚙️</button>
<div id="rot"><i>📱</i><b style="font:900 28px Impact,'Arial Black',sans-serif">Deite a tela</b><span>O jogo roda na horizontal em todos os aparelhos.<br>Gire o aparelho para continuar.</span></div>
<div id="toast"></div>

<script>
const VERSAO='0.004',ADMIN_IDS=['162028398','577082415'];
// Hub: credenciais podem vir da página (window.SUPABASE_*); senão usa os padrões abaixo
const SB_URL=window.SUPABASE_URL||'https://ipqjeacdfiomcxfuixdj.supabase.co';
const SB_KEY=window.SUPABASE_KEY||window.SUPABASE_ANON_KEY||'sb_publishable_EWW84q_43YbOvMwB_Rua-A_X465PbLP';
const T=window.SUPABASE_TABLE||'carteira_diamantes',CID='id_jogador',CD='diamantes'; // ajuste CID/CD se as colunas tiverem outros nomes
window.WC_SERVER=window.WC_SERVER||'https://riverbed-server.onrender.com';
window.HUB=window.HUB||{};HUB.socket=HUB.socket||WC_SERVER;
const $=s=>document.querySelector(s);
let player={dia:0},sb=null,sock=null,st='Conectando…',nt='Conectando…',cur='',lt='Roupas';
let S={inv:[],look:{},modo:'3v3 Jaula',q:'Alta',vol:.7};
const ITENS=[
{id:'c1',t:'Roupas',n:'Camisa Neon',e:'👕',p:150},{id:'c2',t:'Roupas',n:'Moletom Urbano',e:'🧥',p:300},
{id:'c3',t:'Roupas',n:'Bermuda Street',e:'🩳',p:120},{id:'c4',t:'Roupas',n:'Tênis Wave X',e:'👟',p:250},
{id:'a1',t:'Acessórios',n:'Boné Grafite',e:'🧢',p:100},{id:'a2',t:'Acessórios',n:'Óculos Cyber',e:'🕶️',p:180},
{id:'a3',t:'Acessórios',n:'Corte Moicano',e:'💈',p:90},{id:'a4',t:'Acessórios',n:'Corrente Gold',e:'📿',p:220},
{id:'b1',t:'Bolas',n:'Bola Neon',e:'⚽',p:200},{id:'b2',t:'Bolas',n:'Bola Fogo',e:'🔥',p:350},
{id:'b3',t:'Bolas',n:'Bola Gelo',e:'🧊',p:350},{id:'b4',t:'Bolas',n:'Bola Ouro',e:'🏆',p:600}];
const CAT=[['Camisa','--shirt'],['Bermuda','--short'],['Tênis','--shoe'],['Boné','--cap'],['Cabelo','--hair'],['Bola','--ball'],['Óculos','--lens']];
const COR=['#00e5ff','#c6ff00','#ff2e93','#ff9100','#7c4dff','#ffffff','#111111','#ff1744'];
const TIT={loja:'🛒 Loja',pers:'👕 Personagem',modos:'🎮 Modos de jogo',conq:'🏆 Conquistas',soc:'👥 Social',cfg:'⚙️ Configurações',adm:'🛡️ Painel admin'};

function salvar(){localStorage.setItem('sc_save',JSON.stringify(S))}
function initPlayer(){
 let id=localStorage.getItem('wavecombat_id'),nick=localStorage.getItem('wavecombat_nick'),o={};
 try{const r=localStorage.getItem('wavecombat_sessao_ativa');o=r?JSON.parse(r):{}}catch(e){o={nick:localStorage.getItem('wavecombat_sessao_ativa')}}
 if(!o||typeof o!='object')o={nick:String(o)};
 id=id||String(o.id||o.id_jogador||o.userId||'');
 nick=nick||o.nick||o.nome||o.username||o.name||'';
 if(!id){id=String(Math.floor(100000000+Math.random()*900000000));localStorage.setItem('wavecombat_id',id)}
 if(!nick){nick=id=='162028398'?'capudo7':'Player_'+id.substring(0,4);localStorage.setItem('wavecombat_nick',nick)}
 player={id:String(id),name:String(nick),dia:0,adm:ADMIN_IDS.includes(String(id))};
}
function toast(m){const t=$('#toast');t.textContent=m;t.classList.add('on');clearTimeout(toast.t);toast.t=setTimeout(()=>t.classList.remove('on'),2200)}
function beat(){try{const a=new(window.AudioContext||window.webkitAudioContext)(),t=a.currentTime,v=Math.max(S.vol*.6,.0001);[0,.25,.5,.75].forEach((d,i)=>{const o=a.createOscillator(),g=a.createGain();o.connect(g);g.connect(a.destination);o.type=i%2?'square':'sine';o.frequency.setValueAtTime(i%2?220:140,t+d);o.frequency.exponentialRampToValueAtTime(40,t+d+.2);g.gain.setValueAtTime(v,t+d);g.gain.exponentialRampToValueAtTime(.001,t+d+.22);o.start(t+d);o.stop(t+d+.25)})}catch(e){}}
function aplicar(){const r=document.documentElement.style,l=S.look;for(const k in l)r.setProperty(k,l[k]);$('#cap').style.display=l['--cap']=='none'?'none':'';$('#gl').style.display=!l['--lens']||l['--lens']=='none'?'none':''}
function abrir(k){const m=$('#modal'),b=$('#mb'),y=cur==k?b.scrollTop:0;cur=k;$('#mt').textContent=TIT[k];b.innerHTML=P[k]();b.scrollTop=y;m.classList.add('on');m.classList.toggle('r',k=='pers')}
function fechar(){cur='';$('#modal').classList.remove('on','r')}
function cor(v,c){S.look[v]=c;aplicar();salvar();abrir('pers')}
function modo(n){S.modo=n;salvar();$('#bm').textContent='🎮 '+n;fechar();toast('Modo: '+n)}
function copiar(){navigator.clipboard&&navigator.clipboard.writeText(player.id);toast('ID copiado!')}

function tela(){const d=document,e=d.documentElement;
 if(d.fullscreenElement||d.webkitFullscreenElement)return(d.exitFullscreen||d.webkitExitFullscreen).call(d);
 const f=e.requestFullscreen||e.webkitRequestFullscreen;
 if(!f)return toast('Neste aparelho, adicione o jogo à tela inicial');
 Promise.resolve(f.call(e)).then(()=>{try{screen.orientation.lock('landscape').catch(()=>{})}catch(x){}}).catch(()=>toast('Tela cheia indisponível'))}
// ---- Carteira de diamantes (Supabase) ----
function setDia(n){player.dia=n;$('#dia').textContent=n.toLocaleString('pt-BR')}
function sync(t){st=t;const e=$('#ns2');if(e)e.textContent=t}
function net(t,ok){nt=t;$('#net').className='dot'+(ok?' ok':'');const e=$('#ns');if(e)e.textContent=t}
async function carteira(){
 if(!sb)return sync('Offline');
 try{const{data,error}=await sb.from(T).select(CD).eq(CID,player.id).maybeSingle();if(error)throw error;
  if(data)setDia(+data[CD]);else{const u=await sb.from(T).upsert({[CID]:player.id,[CD]:0},{onConflict:CID});if(u.error)throw u.error;setDia(0)}
  sync('Sincronizada ✔')}catch(e){console.error(e);sync('Erro de sincronização')}}
async function gravar(n){if(!sb)return false;const u=await sb.from(T).upsert({[CID]:player.id,[CD]:n},{onConflict:CID});if(u.error){console.error(u.error);return false}setDia(n);return true}
async function comprar(id,cb){const i=ITENS.find(x=>x.id==id);if(!i||S.inv.includes(id))return;
 await carteira();
 if(player.dia<i.p)return toast('💎 Diamantes insuficientes');
 if(await gravar(player.dia-i.p)){S.inv.push(id);salvar();toast('Comprado: '+i.n+' ✔');if(cb)cb();abrir(cur||'loja')}else toast('Falha ao acessar a carteira')}

// ---- Servidor online (Socket.io) ----
function conectar(){
 if(!window.io)return net('Offline',0);
 net('Conectando…',0);
 try{sock=io(WC_SERVER,{transports:['websocket','polling'],query:{id:player.id,nick:player.name}});
  sock.on('connect',()=>net('Online ✔',1));sock.on('disconnect',()=>net('Desconectado',0));sock.on('connect_error',()=>net('Servidor acordando…',0))}catch(e){net('Offline',0)}}

// ---- Ranking global: chamar no fim da partida / Game Over (Etapa 5: apito final) ----
async function enviarResultadoPartida(pontos){
 const idUsuario=player.id,nickJogador=player.full||player.name;
 if(window.supabaseClient){
  try{const{error}=await window.supabaseClient.rpc('atualizar_pontuacao',{p_id_jogador:idUsuario,p_nick:nickJogador,p_pontos:pontos});
   if(error){console.error('Erro ao enviar pontuação para o Leaderboard:',error);toast('Erro ao salvar pontuação')}
   else{console.log('Pontuação registrada com sucesso no Leaderboard!');toast('🏅 Pontuação enviada: '+pontos);if(typeof carregarLeaderboard==='function')carregarLeaderboard()}
  }catch(err){console.error('Exceção ao tentar salvar pontuação:',err)}
 }else console.warn('Cliente do Supabase não encontrado no escopo global.');
}
window.enviarResultadoPartida=enviarResultadoPartida;

// ---- Painel admin ----
function alog(t){const e=$('#al');if(e)e.textContent=t}
async function adm(m){
 if(!player.adm||!sb)return alog('Sem permissão ou sem conexão');
 const id=$('#aid').value.trim()||player.id,q=Math.max(0,parseInt($('#aq').value)||0);
 try{const r=await sb.from(T).select(CD).eq(CID,id).maybeSingle();if(r.error)throw r.error;
  const c=r.data?+r.data[CD]:0,n=m=='add'?c+q:m=='sub'?Math.max(0,c-q):m=='set'?q:c;
  if(m!='get'){const u=await sb.from(T).upsert({[CID]:id,[CD]:n},{onConflict:CID});if(u.error)throw u.error;if(id==player.id)setDia(n)}
  alog('ID '+id+': '+c+(m=='get'?'':' → '+n)+' 💎')}catch(e){alog('Erro: '+(e.message||e))}}

// ---- Subtelas ----
const P={};
P.loja=()=>`<div class="pills">${['Roupas','Acessórios','Bolas'].map(t=>`<button class="pill ${t==lt?'on':''}" onclick="lt='${t}';abrir('loja')">${t}</button>`).join('')}</div><div class="grid">${ITENS.filter(i=>i.t==lt).map(i=>`<div class="card"><div class="e">${i.e}</div><b>${i.n}</b>${S.inv.includes(i.id)?'<small>✔ Seu</small>':`<button class="btn sm" onclick="comprar('${i.id}')">💎 ${i.p}</button>`}</div>`).join('')}</div>`;
P.pers=()=>CAT.map(([n,v])=>`<div style="margin-bottom:12px"><b>${n}</b><div class="pills" style="margin:6px 0 0">${(v=='--cap'||v=='--lens'?['none']:[]).concat(COR).map(c=>`<button class="sw ${S.look[v]==c?'on':''}" style="background:${c=='none'?'#333':c}" onclick="cor('${v}','${c}')">${c=='none'?'✕':''}</button>`).join('')}</div></div>`).join('');

async function resgatar(pr,lv){const p=ps(),a=pr?p.cp:p.cf;if(a.includes(lv)||lvl()<lv||(pr&&!p.pr))return;a.push(lv);await aplicarPremios([pr?PP[lv-1]:PF[lv]]);abrir('passe')}
async function resgatarTudo(){const p=ps(),l=[];for(let v=1;v<=lvl();v++){if(PF[v]&&!p.cf.includes(v)){p.cf.push(v);l.push(PF[v])}if(p.pr&&!p.cp.includes(v)){p.cp.push(v);l.push(PP[v-1])}}if(!l.length)return toast('Nada para resgatar');await aplicarPremios(l);abrir('passe')}
async function comprarPasse(){await carteira();if(player.dia<600)return toast('💎 Diamantes insuficientes');if(await gravar(player.dia-600)){ps().pr=1;salvar();toast('Passe Premium ativado 👑');abrir('passe')}else toast('Falha ao acessar a carteira')}
async function comprarNiveis(){if(lvl()>=30)return toast('Você já está no nível 30');await carteira();if(player.dia<150)return toast('💎 Diamantes insuficientes');if(await gravar(player.dia-150)){ps().xp=3000;salvar();toast('Todos os níveis liberados!');abrir('passe')}else toast('Falha ao acessar a carteira')}
