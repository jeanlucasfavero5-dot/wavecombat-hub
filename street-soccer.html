// ---- Carteira de diamantes (Supabase) ----
function setDia(n){player.dia=n;$('#dia').textContent=n.toLocaleString('pt-BR')}
function sync(t){st=t;const e=$('#ns2');if(e)e.textContent=t}
function net(t,ok){nt=t;$('#net').className='dot'+(ok?' ok':'');const e=$('#ns');if(e)e.textContent=t}
async function carteira(){
 if(!sb)return sync('Offline');
 try{const{data,error}=await sb.from(T).select(CD).eq(CID,player.id).maybeSingle();if(error)throw error;
  if(data)setDia(+data[CD]);else{const u=await sb.from(T).upsert({[CID]:player.id,[CD]:0},{onConflict:CID});if(u.error)throw u.error;setDia(0)}
  sync('Sincronizada ✔')}catch(e){console.error(e);sync('Erro de sincronização')}}
async function gravar(n){if(!sb)return false;const u=await sb.from(T).upsert({[CID]:player.id,[CD]:n},{onConflict:CID});if(u.error){console.error(u.error);return false}setDia(n);return true}
async function comprar(id,cb){const i=ITENS.find(x=>x.id==id);if(!i||S.inv.includes(id))return;
 await carteira();
 if(player.dia<i.p)return toast('💎 Diamantes insuficientes');
 if(await gravar(player.dia-i.p)){S.inv.push(id);salvar();toast('Comprado: '+i.n+' ✔');if(cb)cb();abrir(cur||'loja')}else toast('Falha ao acessar a carteira')}

// ---- Servidor online (Socket.io) ----
function conectar(){
 if(!window.io)return net('Offline',0);
 net('Conectando…',0);
 try{sock=io(WC_SERVER,{transports:['websocket','polling'],query:{id:player.id,nick:player.name}});
  sock.on('connect',()=>net('Online ✔',1));sock.on('disconnect',()=>net('Desconectado',0));sock.on('connect_error',()=>net('Servidor acordando…',0))}catch(e){net('Offline',0)}}

// ---- Ranking global: chamar no fim da partida / Game Over (Etapa 5: apito final) ----
async function enviarResultadoPartida(pontos){
 const idUsuario=player.id,nickJogador=player.full||player.name;
 if(window.supabaseClient){
  try{const{error}=await window.supabaseClient.rpc('atualizar_pontuacao',{p_id_jogador:idUsuario,p_nick:nickJogador,p_pontos:pontos});
   if(error){console.error('Erro ao enviar pontuação para o Leaderboard:',error);toast('Erro ao salvar pontuação')}
   else{console.log('Pontuação registrada com sucesso no Leaderboard!');toast('🏅 Pontuação enviada: '+pontos);if(typeof carregarLeaderboard==='function')carregarLeaderboard()}
  }catch(err){console.error('Exceção ao tentar salvar pontuação:',err)}
 }else console.warn('Cliente do Supabase não encontrado no escopo global.');
}
window.enviarResultadoPartida=enviarResultadoPartida;

  else{TM=null;player.tag=''}}catch(e){}
 S.tag=player.tag;salvar();atualizaNome();chInit('t',TM?'time-'+TM.id:'')}

async function criarTime(){
 const n=ED.n.trim(),t=ED.t;
 if(n.length<3)return toast('Nome com 3 ou mais letras');
 if(t.length!=3)return toast('A TAG precisa ter 3 caracteres');

 await carteira();
 if(player.dia<100)return toast('💎 Diamantes insuficientes');
 if(!await gravar(player.dia-100))return toast('Falha ao acessar a carteira');
 const id=String(100000+Math.floor(Math.random()*900000));
 await DB.ins('times',{id,nome:n,tag:t,capitao_id:player.id,bandeira:{c:ED.c,g:ED.g,l:ED.l.slice(),bg:ED.bg,fr:ED.fr}});
 await DB.ins('time_membros',{time_id:id,jogador_id:player.id,nick:player.name});
 if(DB.off)['Bot_Neymar','Bot_Pelé'].forEach((b,i)=>DB.ins('time_pedidos',{time_id:id,jogador_id:'9000'+i,nick:b}));
 toast('Time criado! ID '+id);await timeSync();tb='m';abrir('time')}
P.timeb=()=>{buscar(bq);return`<button class="btn sm" style="margin-bottom:12px" onclick="ED={n:'',t:'',c:0,g:0,l:[],cat:'c',bg:0,fr:4};abrir('timec')">➕ Criar time 💎 100</button><input id="bq" placeholder="Buscar por ID, nome ou TAG" value="${esc(bq)}" onkeydown="if(event.key=='Enter')buscar(this.value)"><button class="pill on" onclick="buscar($('#bq').value)">Buscar</button><div id="bres" style="margin-top:10px">Carregando…</div>`};
async function buscar(q){
 bq=san(q||'').trim();let a=await DB.sel('times',{});
 if(bq){const s=bq.toLowerCase();a=a.filter(t=>t.id==bq||String(t.nome).toLowerCase().includes(s)||String(t.tag).toLowerCase()==s)}
 const ps=await DB.sel('time_pedidos',{jogador_id:player.id}),el=$('#bres');if(!el||cur!='timeb')return;
 el.innerHTML=(DB.off?'<small style="opacity:.7">Modo local: crie as tabelas no Supabase para times online.</small>':'')+(a.length?a.slice(0,20).map(t=>`<div class="card" style="flex-direction:row;text-align:left;margin:8px 0">${flag(t.bandeira||{},t.tag,50)}<div style="flex:1"><b>${esc(t.nome)}</b> <i class="adm">${esc(t.tag)}</i><br><small>ID ${esc(t.id)}</small></div>${ps.some(p=>p.time_id==t.id)?'<small>Pedido enviado</small>':`<button class="btn sm" onclick="pedir('${esc(t.id)}')">Pedir para entrar</button>`}</div>`).join(''):'<div class="card">Nenhum time encontrado.</div>')}
async function pedir(id){if(player.tag)return toast('Você já está em um time');await DB.ins('time_pedidos',{time_id:id,jogador_id:player.id,nick:player.name});toast('Pedido enviado!');buscar(bq)}
P.time=()=>{tvRender();return'<div id="tv">Carregando…</div>'};
async function tvRender(){
 const t=TM;if(!t)return;
 const[m,r]=await Promise.all([DB.sel('time_membros',{time_id:t.id}),DB.sel('time_pedidos',{time_id:t.id})]),cap=t.capitao_id==player.id,el=$('#tv');
 if(!el||cur!='time')return;
 const row=(x,b)=>`<div class="card" style="flex-direction:row;text-align:left;margin-bottom:8px"><span class="pf">${esc((x.nick||'?')[0]).toUpperCase()}</span><div style="flex:1"><b>${esc(x.nick)}</b>${x.jogador_id==t.capitao_id?'<i class="adm">CAPITÃO</i>':''}<br><small>ID ${esc(x.jogador_id)}</small></div>${b}</div>`;
 const body=tb=='m'?m.map(x=>row(x,cap&&x.jogador_id!=player.id?`<button class="btn sm" ${RED} onclick="remover('${esc(x.jogador_id)}')">Remover</button>`:'')).join(''):tb=='p'?(cap?(r.length?r.map(x=>row(x,`<button class="btn sm" onclick="pedido('${esc(x.jogador_id)}',1)">Aceitar</button><button class="btn sm" ${RED} onclick="pedido('${esc(x.jogador_id)}',0)">Recusar</button>`)).join(''):'<div class="card">Nenhum pedido.</div>'):'<div class="card">Só o capitão vê os pedidos.</div>'):(cap?`<input id="rn" maxlength="20" placeholder="Novo nome do time"><button class="btn sm" onclick="renomear()">Renomear 💎 50</button><div style="height:18px"></div><button class="btn sm" ${RED} onclick="excluir(this)">Excluir time</button><div style="height:14px"></div><small>Fundo do time</small><div class="pills">${BG.map((x,i)=>`<button class="pill ${(t.bandeira||{}).bg==i?'on':''}" style="opacity:${own('bg'+i)?1:.5}" onclick="tset('bg',${i})">${x[0]}</button>`).join('')}</div><small>Moldura do time</small><div class="pills">${FR.map((x,i)=>`<button class="pill ${(t.bandeira||{}).fr==i?'on':''}" style="opacity:${own('fr'+i)?1:.5}" onclick="tset('fr',${i})">${x[0]}</button>`).join('')}</div>`:`<button class="btn sm" ${RED} onclick="sair()">Sair do time</button>`);
 el.innerHTML=`<div class="card" style="flex-direction:row;text-align:left;gap:16px;margin-bottom:12px;border:6px solid transparent;border-radius:22px;background:${tbg(t)};text-shadow:0 2px 6px #000">${flag(t.bandeira||{},t.tag,90)}<div style="flex:1"><b style="font-size:24px">${esc(t.nome)}</b> <i class="adm">${esc(t.tag)}</i><br><small>ID do time: <b>${esc(t.id)}</b> · ${m.length}/11 membros</small></div></div><div class="pills">${[['m','Membros ('+m.length+')'],['p','Pedidos'+(cap?' ('+r.length+')':'')],['o','Opções']].map(([k,n])=>`<button class="pill ${tb==k?'on':''}" onclick="tb='${k}';abrir('time')">${n}</button>`).join('')}</div>${body}`}
async function renomear(){const n=san($('#rn').value).trim();if(n.length<3)return toast('Nome com 3 ou mais letras');await carteira();if(player.dia<50)return toast('💎 Diamantes insuficientes');if(!await gravar(player.dia-50))return toast('Falha ao acessar a carteira');await DB.upd('times',{id:TM.id},{nome:n});toast('Time renomeado');await timeSync();abrir('time')}
async function excluir(b){if(!b.dataset.c){b.dataset.c=1;b.textContent='Toque de novo para confirmar';return}const id=TM.id;await DB.del('time_pedidos',{time_id:id});await DB.del('time_membros',{time_id:id});await DB.del('times',{id});toast('Time excluído');await timeSync();abrir('timeb')}
async function sair(){await DB.del('time_membros',{jogador_id:player.id});toast('Você saiu do time');await timeSync();abrir('timeb')}
async function remover(id){await DB.del('time_membros',{jogador_id:id});toast('Jogador removido');abrir('time')}
async function pedido(id,ok){const p=(await DB.sel('time_pedidos',{time_id:TM.id,jogador_id:id}))[0];if(!p)return abrir('time');
 if(ok){const m=await DB.sel('time_membros',{time_id:TM.id});if(m.length>=11)return toast('Time cheio (máx. 11)');await DB.ins('time_membros',{time_id:TM.id,jogador_id:id,nick:p.nick})}

const PF={5:'g75',10:'ip1',12:'g150',15:'ibg1',20:'ip2',25:'ifr0',27:'g250',29:'ip3',30:'ibg5'};
const PP=['g150','iq1','d25','ifr3','iq2','g250','iq3','d25','ibg2','iq4','g350','iq5','d25','ifr2','iq6','g450','iq7','d25','ibg3','iq8','g600','iq9','d25','ifr1','iq10','ibg4','iq11','d25','iq12','ifr5'];
const ps=()=>{const m=new Date().toISOString().slice(0,7);if(!S.ps||S.ps.m!=m)S.ps={m,xp:0,pr:0,cf:[],cp:[]};return S.ps};
const lvl=()=>Math.min(30,Math.floor(ps().xp/100));
function ganharXP(n){ps().xp=Math.min(3000,ps().xp+n);salvar()}
const rw=c=>{if(c[0]=='g')return['🪙',c.slice(1)+' ouro'];if(c[0]=='d')return['💎',c.slice(1)+' 💎'];const i=ITENS.find(x=>x.id==c.slice(1))||{};return[i.e||'🎁',i.n||'Item']};
const cell=(c,lv,pr)=>{const p=ps(),done=(pr?p.cp:p.cf).includes(lv),open=lvl()>=lv&&(!pr||p.pr),r=rw(c);
 return`<div class="card" style="width:92px;height:128px;padding:8px;justify-content:center;${open&&!done?'border-color:var(--n1);box-shadow:0 0 14px #c6ff0066;':''}${done?'opacity:.55':''}"><span style="font-size:30px">${r[0]}</span><small style="line-height:1.1">${r[1]}</small>${done?'<small>✔ Resgatado</small>':open?`<button class="btn sm" onclick="resgatar(${pr},${lv})">Resgatar</button>`:`<small>${pr&&!p.pr?'👑 Premium':'🔒 Nv '+lv}</small>`}</div>`};
P.passe=()=>{const p=ps(),l=lvl(),n=new Date(),dias=Math.ceil((new Date(n.getFullYear(),n.getMonth()+1,1)-n)/864e5);
 return`<div class="card" style="align-items:stretch;text-align:left;margin-bottom:12px"><b style="font-size:20px">Passe do mês ${p.pr?'👑 Premium':''}</b><small>Termina em ${dias} dias · Nível ${l}/30 · ${l>=30?'máximo':p.xp%100+'/100 XP'}</small><div class="bar"><i style="width:${l>=30?100:p.xp%100}%"></i></div><div class="pills" style="margin:10px 0 0">${p.pr?'':'<button class="btn sm" onclick="comprarPasse()">Comprar passe 💎 600</button>'}<button class="btn sm" onclick="comprarNiveis()">Comprar todos os níveis 💎 150</button><button class="btn sm" onclick="resgatarTudo()">Resgatar tudo</button></div></div><div style="display:flex;gap:8px;overflow-x:auto;padding-bottom:8px"><div style="display:flex;flex-direction:column;gap:8px;padding-top:24px"><b style="height:128px;display:grid;place-items:center">Grátis</b><b style="height:128px;display:grid;place-items:center">👑 Premium</b></div>${PP.map((c,i)=>`<div style="display:flex;flex-direction:column;gap:8px;align-items:center"><b style="height:16px">Nv ${i+1}</b>${PF[i+1]?cell(PF[i+1],i+1,0):'<div style="width:92px;height:128px"></div>'}${cell(c,i+1,1)}</div>`).join('')}</div>`};
async function aplicarPremios(lista){let g=0,d=0;const it=[];
 lista.forEach(c=>{c[0]=='g'?g+=+c.slice(1):c[0]=='d'?d+=+c.slice(1):it.push(c.slice(1))});
 if(d){await carteira();await gravar(player.dia+d)}
 if(g)setOuro(ouro()+g);
 it.forEach(i=>{if(!S.inv.includes(i))S.inv.push(i)});salvar();
 toast('Recebido: '+[g&&'🪙 '+g,d&&'💎 '+d,it.length&&it.length+' item(ns)'].filter(Boolean).join('  '))}
async function resgatar(pr,lv){const p=ps(),a=pr?p.cp:p.cf;if(a.includes(lv)||lvl()<lv||(pr&&!p.pr))return;a.push(lv);await aplicarPremios([pr?PP[lv-1]:PF[lv]]);abrir('passe')}
async function resgatarTudo(){const p=ps(),l=[];for(let v=1;v<=lvl();v++){if(PF[v]&&!p.cf.includes(v)){p.cf.push(v);l.push(PF[v])}if(p.pr&&!p.cp.includes(v)){p.cp.push(v);l.push(PP[v-1])}}if(!l.length)return toast('Nada para resgatar');await aplicarPremios(l);abrir('passe')}
async function comprarPasse(){await carteira();if(player.dia<600)return toast('💎 Diamantes insuficientes');if(await gravar(player.dia-600)){ps().pr=1;salvar();celebrar('👑','PASSE PREMIUM ATIVADO!');abrir('passe')}else toast('Falha ao acessar a carteira')}
async function comprarNiveis(){if(lvl()>=30)return toast('Você já está no nível 30');await carteira();if(player.dia<150)return toast('💎 Diamantes insuficientes');if(await gravar(player.dia-150)){ps().xp=3000;salvar();celebrar('🏆','TODOS OS NÍVEIS LIBERADOS!');abrir('passe')}else toast('Falha ao acessar a carteira')}

['Brasil',()=>'<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 160"><rect width="300" height="160" fill="#009c3b"/><path d="M150 14L286 80L150 146L14 80z" fill="#ffdf00" stroke="#ffd54f" stroke-width="4"/><circle cx="150" cy="80" r="44" fill="#002776"/><path d="M108 84Q150 64 192 84" stroke="#fff" stroke-width="6" fill="none"/><g fill="#ffd54f"><circle cx="130" cy="96" r="2.5"/><circle cx="150" cy="104" r="2.5"/><circle cx="170" cy="96" r="2.5"/><circle cx="150" cy="62" r="2.5"/></g><rect width="300" height="160" fill="none" stroke="#ffd54f" stroke-width="8"/></svg>']];
const FR=[['Campo','repeating-linear-gradient(90deg,#fff 0 10px,#2e7d32 10px 20px)'],['Taça','linear-gradient(135deg,#fff3b0,#ffd54f,#b8860b,#ffe082)'],['Rede','repeating-linear-gradient(45deg,#fff 0 3px,#1b1b2f 3px 8px)'],['Cartões','repeating-linear-gradient(45deg,#ffd600 0 10px,#d50000 10px 20px)'],['Neon','linear-gradient(90deg,#c6ff00,#00e5ff,#ff2e93,#c6ff00)'],['Brasil dourada','linear-gradient(135deg,#ffd54f,#009c3b 30%,#ffdf00 55%,#002776 75%,#ffd54f)']];
const own=id=>id=='bg0'||id=='fr4'||S.inv.includes(id);
const pbg=()=>S.bg=='t'?((TM&&TM.bandeira&&TM.bandeira.bg)||0):(S.bg||0);
const pfr=()=>S.fr=='t'?((TM&&TM.bandeira&&TM.bandeira.fr!=null)?TM.bandeira.fr:4):(S.fr==null?4:S.fr);
const bgCSS=(i,f)=>`url('data:image/svg+xml,${encodeURIComponent((BG[i]||BG[0])[1]()).replace(/'/g,'%27')}') center/cover padding-box,${(FR[f]||FR[4])[1]} border-box`;
const tbg=t=>{const b=t.bandeira||{};return bgCSS(b.bg||0,b.fr==null?4:b.fr)};
function tsel(c,i){if(!own(c+i))return toast('Bloqueado: ganhe no passe 🎟️');ED[c]=i;abrir('timec')}
async function tset(k,i){if(!own(k+i))return toast('Bloqueado: ganhe no passe 🎟️');await DB.upd('times',{id:TM.id},{bandeira:Object.assign({},TM.bandeira,{[k]:i})});await timeSync();abrir('time')}

// ---- Perfil ----
const STN=()=>Object.assign({pj:0,v:0,d:0,g:0,a:0,dr:0},S.st||{});
let pc='bg';
P.perfil=()=>{const st=STN(),pct=st.pj?Math.round(st.v/st.pj*100):0,bi=pbg(),fi=pfr(),tile=(l,v)=>`<div class="card" style="padding:8px"><b style="font-size:20px">${v}</b><small>${l}</small></div>`,
 opts=(pc=='bg'?BG:FR).map((x,i)=>{const ok=own(pc+i),on=(pc=='bg'?bi:fi)==i&&S[pc]!='t';return`<div class="card ${on?'sel':''}" style="cursor:pointer;opacity:${ok?1:.5};padding:6px" onclick="escolher('${pc}',${i})"><div style="width:72px;height:44px;border-radius:10px;border:4px solid transparent;background:${pc=='bg'?bgCSS(i,4):`linear-gradient(#2a1460,#2a1460) padding-box,${x[1]} border-box`}"></div><small>${x[0]}${ok?'':' 🔒'}</small></div>`}).join('');
 return`<div style="border:6px solid transparent;border-radius:22px;background:${bgCSS(bi,fi)};padding:16px;display:flex;gap:14px;align-items:center;margin-bottom:12px"><span class="pf" style="width:64px;height:64px;font-size:30px;border:5px solid transparent;background:linear-gradient(135deg,#ff2e93,#7c4dff) padding-box,${FR[fi][1]} border-box">${esc(player.name[0]).toUpperCase()}</span><div style="text-shadow:0 2px 6px #000"><b style="font-size:22px">${esc(player.full||player.name)}</b><br><small>ID ${esc(player.id)} · Nível ${lvl()} do passe</small></div></div>
<div class="grid" style="grid-template-columns:repeat(auto-fill,minmax(92px,1fr));margin-bottom:12px">${tile('Partidas',st.pj)+tile('Vitórias',st.v)+tile('Derrotas',st.d)+tile('% vitórias',pct+'%')+tile('Gols',st.g)+tile('Assistências',st.a)+tile('Dribles',st.dr)}</div>
<div class="card" style="flex-direction:row;text-align:left;margin-bottom:12px">${TM?`${flag(TM.bandeira||{},TM.tag,56)}<div style="flex:1"><b>${esc(TM.nome)}</b> <i class="adm">${esc(TM.tag)}</i><br><small>ID do time ${esc(TM.id)}</small></div><button class="btn sm" onclick="abrirTime()">Ver time</button>`:`<span style="font-size:34px">🛡️</span><div style="flex:1"><b>Sem time</b><br><small>Entre ou crie um time.</small></div><button class="btn sm" onclick="abrirTime()">Procurar</button>`}</div>
<div class="pills"><button class="pill ${pc=='bg'?'on':''}" onclick="pc='bg';abrir('perfil')">Fundo do perfil</button><button class="pill ${pc=='fr'?'on':''}" onclick="pc='fr';abrir('perfil')">Moldura</button>${TM?`<button class="pill ${S[pc]=='t'?'on':''}" onclick="escolher('${pc}','t')">Usar ${pc=='bg'?'o fundo':'a moldura'} do time</button>`:''}</div><div class="grid" style="grid-template-columns:repeat(auto-fill,minmax(104px,1fr))">${opts}</div>
<button class="btn" style="margin-top:16px" onclick="fechar()">← Voltar para o lobby</button>`};
function escolher(k,i){if(i!=='t'&&!own(k+i))return toast('Bloqueado: ganhe no passe 🎟️');S[k]=i;salvar();atualizaNome();abrir('perfil')}

// ---- Admin sem diamantes ----
P.adm=()=>!player.adm?'Acesso negado':`<div class="card" style="align-items:stretch;text-align:left"><small>Pontos para o teste do ranking (RPC atualizar_pontuacao)</small><input id="aq" type="number" value="10"><div class="pills"><button class="pill on" onclick="enviarResultadoPartida(parseInt($('#aq').value)||10)">Enviar pontuação teste</button><button class="pill on" onclick="ganharXP(100);toast('+100 XP do passe')">+100 XP passe</button><button class="pill" onclick="localStorage.removeItem('sc_save');location.reload()">Limpar dados locais</button></div></div><pre id="al">Pronto.</pre>`;
function adm(){}

// ---- Chat global (Supabase Realtime) ----
const CH={g:{n:'',m:[],c:null},t:{n:'',m:[],c:null}};let ct='g',lastMsg=0;
function chInit(k,name){const o=CH[k];if(!sb||o.n==name)return;if(o.c)sb.removeChannel(o.c);o.n=name;o.c=null;if(k=='t')o.m=[];if(!name)return;o.c=sb.channel(name,{config:{broadcast:{self:true}}}).on('broadcast',{event:'msg'},({payload})=>{o.m.push(payload);if(o.m.length>60)o.m.shift();chRender()}).subscribe()}
function chRender(){const pv=$('#cpv'),lg=$('#clog'),f=x=>`<div><b style="color:${x.id==player.id?'#c6ff00':'#7cf'}">${esc(x.n)}</b>: ${esc(x.t)}</div>`;
 if(pv)pv.innerHTML=CH.g.m.slice(-3).map(f).join('')||'<div style="opacity:.6">Toque para abrir o chat</div>';
 if(lg){lg.innerHTML=CH[ct].m.map(f).join('')||'<div style="opacity:.6">Sem mensagens ainda.</div>';lg.scrollTop=1e9}}
function chSend(){const i=$('#cin');if(!i)return;const t=san(i.value).trim().slice(0,120);if(!t||Date.now()-lastMsg<1200)return;lastMsg=Date.now();i.value='';const p={n:player.full||player.name,id:player.id,t},o=CH[ct];if(o.c)o.c.send({type:'broadcast',event:'msg',payload:p});else{o.m.push(p);chRender()}}
P.chat=()=>{if(ct=='t'&&!TM)ct='g';setTimeout(chRender,0);return`<div class="pills"><button class="pill ${ct=='g'?'on':''}" onclick="ct='g';abrir('chat')">Todos</button>${TM?`<button class="pill ${ct=='t'?'on':''}" onclick="ct='t';abrir('chat')">Time</button>`:''}</div><div id="clog" style="height:36vh;overflow:auto;background:#0005;border-radius:14px;padding:10px;font-size:14px;user-select:text"></div><div style="display:flex;gap:8px;margin-top:8px"><input id="cin" maxlength="120" placeholder="Digite uma mensagem" onkeydown="if(event.key=='Enter')chSend()" style="margin:0"><button class="btn sm" onclick="chSend()">Enviar</button></div>`};

(()=>{const ev=['pointerup','touchend','click','keydown'],f=()=>{ev.forEach(e=>removeEventListener(e,f,true));if(window.musica)musica();const s=$('#snd');if(s)s.remove()};ev.forEach(e=>addEventListener(e,f,true))})();
document.addEventListener('DOMContentLoaded',()=>{try{musica()}catch(e){}SL.cabelo[1]=S.sexo=='f'?HF:HM;aplicar();CH.g.m.push({n:'Sistema',id:'0',t:'Bem-vindo ao chat global!'});chInit('g','sc-global');chRender()});
