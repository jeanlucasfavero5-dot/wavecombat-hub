<!DOCTYPE html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Zombie House – Menus</title>
<style>
:root{--p:#161b22;--p2:#21262d;--t:#e6edf3;--m:#8b949e;--a:#c0392b;--g:#2ea043;--y:#e3b341;--b:#30363d;color-scheme:dark}
*{box-sizing:border-box}html,body{height:100%;margin:0}
body{position:fixed;inset:0;background:radial-gradient(#1b2330,#07090c);color:var(--t);font:15px system-ui,sans-serif;user-select:none}
#app{position:absolute;inset:0;overflow:auto;padding:calc(58px + env(safe-area-inset-top,0px)) 14px calc(30px + env(safe-area-inset-bottom,0px))}
.ct{margin:auto;width:min(380px,100%);display:flex;flex-direction:column;gap:10px}
h1,h2,h3{margin:4px 0}
button{background:var(--p2);color:var(--t);border:1px solid var(--b);border-radius:8px;padding:10px 14px;font:inherit;cursor:pointer}
button:hover{border-color:var(--a)}button:disabled{opacity:.4;cursor:default}button.pr{background:var(--a);border-color:var(--a)}
input,select{background:#0a0e13;color:var(--t);border:1px solid var(--b);border-radius:8px;padding:10px;font:inherit;width:100%}
label{display:grid;gap:4px;color:var(--m);font-size:12px}
.c{background:var(--p);border:1px solid var(--b);border-radius:12px;padding:12px}
.r{display:flex;gap:8px;flex-wrap:wrap;align-items:center}.nw{flex-wrap:nowrap}
.g{display:grid;gap:8px;grid-template-columns:repeat(auto-fill,minmax(130px,1fr))}
.on2{border-color:var(--y)!important}
table{width:100%;border-collapse:collapse}td,th{padding:6px;border-bottom:1px solid var(--b);text-align:left}
#hud{position:fixed;top:calc(8px + env(safe-area-inset-top,0px));right:10px;display:none;gap:8px;z-index:20}
#hud button{width:42px;height:42px;padding:0;font-size:20px;position:relative}
.bd{position:absolute;top:-4px;right:-4px;background:var(--a);border-radius:9px;font-size:11px;padding:1px 5px}
#ver{position:fixed;right:10px;bottom:calc(6px + env(safe-area-inset-bottom,0px));color:var(--m);font-size:12px}
.mo{display:none;position:fixed;inset:0;background:#000b;z-index:30;align-items:center;justify-content:center;padding:16px}.mo.on{display:flex}
.mo>div{background:var(--p);border:1px solid var(--b);border-radius:12px;padding:16px;width:min(420px,100%);max-height:90%;overflow:auto;display:flex;flex-direction:column;gap:10px}
#tt{position:fixed;bottom:40px;left:50%;transform:translateX(-50%);background:#000d;padding:8px 14px;border-radius:20px;opacity:0;transition:.3s;z-index:60;pointer-events:none}
.av{position:relative;overflow:hidden;flex:none;cursor:pointer;max-width:34vh;max-height:34vh}
body{font-size:clamp(13px,1.4vw + 8px,16px);touch-action:manipulation;-webkit-text-size-adjust:100%}
input,select{min-width:0;font-size:16px;-webkit-user-select:text;user-select:text}
button{max-width:100%}.c{overflow-x:auto}.c,.ct{word-break:break-word}
h1{font-size:clamp(22px,5vw,32px)}
#tt{max-width:90vw;text-align:center}
.pvs{height:min(280px,40vh);aspect-ratio:1/2;width:auto}
.plb{flex:none;width:58px;display:flex;flex-direction:column;gap:6px}
.pts{flex:1;min-width:0;display:flex;gap:6px;overflow-x:auto;padding-bottom:6px}
.pcl{flex:none;width:78px;display:flex;flex-direction:column;gap:6px}
.pn{height:22px;text-align:center;color:var(--m);font-size:12px}.pn.ok{color:var(--y);font-weight:700}
.pc{height:78px;display:flex;align-items:center;justify-content:center;text-align:center;font-size:12px;line-height:1.3;border:1px solid var(--b);border-radius:8px;background:var(--p2);padding:2px;cursor:pointer}
.plb .pc{cursor:default;font-weight:700}.pcl .pc:last-child{background:#2a2410}
.pc.ok{border-color:var(--g);box-shadow:0 0 8px #2ea04388}.pc.lk{opacity:.5}.pc.gt{opacity:.35}
:root{--vh:100vh}body{height:var(--vh,100%)}
#hud{right:calc(10px + env(safe-area-inset-right,0px))}
#ver{pointer-events:none;background:#0008;padding:2px 6px;border-radius:6px}
#app{overflow-x:hidden;padding-left:max(14px,env(safe-area-inset-left,0px));padding-right:max(14px,env(safe-area-inset-right,0px))}
.mo>div{max-height:calc(var(--vh,100vh) - 24px)}
svg,img{max-width:100%}
#c3{position:absolute;inset:0;width:100%;height:100%;display:none}
.lb{position:absolute;inset:0;pointer-events:none}.lb button,.lb .c{pointer-events:auto}.lb .c{background:#161b22cc}
.lbL{position:absolute;left:max(10px,env(safe-area-inset-left,0px));top:calc(8px + env(safe-area-inset-top,0px));width:min(230px,36vw);display:flex;flex-direction:column;gap:6px}
.lbp{display:flex;gap:8px;align-items:center;cursor:pointer}
.lbR{position:absolute;right:max(10px,env(safe-area-inset-right,0px));top:calc(60px + env(safe-area-inset-top,0px));display:flex;flex-direction:column;gap:8px}
.lbR button{width:44px;height:44px;padding:0;font-size:20px}
.lbB{position:absolute;left:max(10px,env(safe-area-inset-left,0px));bottom:calc(10px + env(safe-area-inset-bottom,0px));width:min(260px,38vw);display:flex;flex-direction:column;gap:6px}
.lbB .r{gap:4px;flex-wrap:nowrap}.lbB .r button{flex:1;padding:6px 2px;font-size:12px}
.lbS{position:absolute;right:max(10px,env(safe-area-inset-right,0px));bottom:calc(10px + env(safe-area-inset-bottom,0px));width:min(180px,30vw);height:56px;font-size:18px;font-weight:700}
.fb{position:absolute;left:50%;bottom:12%;transform:translateX(-50%);pointer-events:none}
@media(max-height:500px){.ct{gap:6px}h1{margin:0;font-size:20px}input,select{padding:7px}.mo>div{padding:12px}}
@media(max-height:430px){.lbL .c{padding:5px 8px}.lbL button,.lbB button{padding:5px 8px;font-size:12px}.lbp .av{width:40px!important;height:40px!important}.lbR button{width:38px;height:38px}.lbS{height:46px;font-size:15px}}
.cg{display:grid;grid-template-columns:minmax(150px,200px) 1fr;gap:12px;max-width:900px;margin:auto}
@media(max-width:600px){.cg{grid-template-columns:1fr}}
@media(max-height:500px){#app{padding-top:calc(52px + env(safe-area-inset-top,0px))}button{padding:7px 10px}.mn{display:grid;grid-template-columns:1fr 1fr;width:min(560px,100%)}.mn h2{grid-column:1/-1}.c{padding:8px}}
.fr0{border:3px solid #8b949e}
.fr1{border:4px solid;border-image:linear-gradient(135deg,#fff6b0,#d4a017 30%,#fff6b0 50%,#b8860b 75%,#ffd700) 1;box-shadow:0 0 14px #ffd700aa}
.fr1::after{content:"";position:absolute;inset:0;pointer-events:none;background:linear-gradient(115deg,transparent 40%,#fffa 50%,transparent 60%);animation:sw 2.5s infinite}
@keyframes sw{from{transform:translateX(-100%)}to{transform:translateX(100%)}}
.dot{display:inline-block;width:12px;height:12px;border-radius:50%;margin-right:4px;border:1px solid #fff4}

#app{padding-top:calc(58px / var(--z) + env(safe-area-inset-top,0px))}
.mo>div{transform:scale(var(--z));max-height:calc((var(--vh,100vh) - 16px) / var(--z));width:min(420px,calc((100vw - 16px) / var(--z)))}
.hz{font-family:Creepster,Impact,'Arial Black',fantasy;font-weight:400;letter-spacing:.06em;text-align:center;margin:0;color:#b7ff1a;text-shadow:0 0 6px #5dff1a,0 0 22px #2fa80f,0 4px 0 #0b2205,0 7px 14px #000;animation:fl 3.2s infinite}
.hzi{position:absolute;top:calc(5% + env(safe-area-inset-top,0px));left:0;right:0;font-size:min(10vw,24vh)}
@keyframes fl{0%,92%,100%{opacity:1}94%{opacity:.55}96%{opacity:1}98%{opacity:.4}}
.st{position:absolute;inset:0;background:linear-gradient(#0009,#0000 38%,#000b),var(--img) center/cover no-repeat}
.sb{position:absolute;left:50%;bottom:calc(12% + env(safe-area-inset-bottom,0px));transform:translateX(-50%);padding:12px 34px;font-size:clamp(15px,2.6vw,24px);letter-spacing:.2em;font-weight:700;color:#e8ffd0;background:rgba(150,30,20,.9);border:2px solid #7cff2a;box-shadow:0 0 18px #3ddc1c;animation:bk 1.1s infinite}
@keyframes bk{0%,100%{opacity:.9}50%{opacity:.25}}
.ib{display:flex;gap:4px;flex-wrap:wrap}.ib button{width:38px;height:38px;padding:0;font-size:18px}
.lbB{left:auto;right:max(10px,env(safe-area-inset-right,0px));width:min(240px,34vw)}
.lbS{position:static;width:100%}
.fs{position:absolute;inset:0;display:flex;flex-direction:column;gap:8px;padding:calc(8px + env(safe-area-inset-top,0px)) max(10px,env(safe-area-inset-right,0px)) calc(8px + env(safe-area-inset-bottom,0px)) max(10px,env(safe-area-inset-left,0px))}
.fh{display:flex;align-items:center;justify-content:space-between;gap:8px;padding-right:100px;min-height:44px}
.fb2{flex:1;min-height:0;display:flex;gap:8px}
.tabs{flex:none;width:min(130px,26vw);display:flex;flex-direction:column;gap:6px}
.bp{flex:1;min-width:0;overflow:auto;display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:8px;align-content:start}
.og{display:grid;grid-template-columns:1fr 1fr;gap:6px;align-content:start;min-width:0}
@media(max-width:600px){.og{grid-template-columns:1fr}}
.pc{height:64px}
.sw{position:absolute;left:50%;bottom:calc(8% + env(safe-area-inset-bottom,0px));transform:translateX(-50%);display:flex;flex-direction:column;align-items:center;gap:10px}.sw .sb{position:static;transform:none}.sf{background:#0009;border-color:#7cff2a;color:#e8ffd0;letter-spacing:.1em}
.lbB{right:calc(max(10px,env(safe-area-inset-right,0px)) + 56px)}@media(max-height:430px){.lbR button{width:38px;height:38px}.lbB{right:calc(max(10px,env(safe-area-inset-right,0px)) + 50px)}}
.pnm{position:absolute;left:50%;bottom:calc(5% + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:#000a;padding:3px 14px;border-radius:14px;font-weight:700;pointer-events:none;white-space:nowrap}
.vi{display:inline-block;font-style:normal;font-weight:900;color:#ffd700;text-shadow:0 0 6px #ffb700,0 1px 0 #7a5200;animation:vr 2s linear infinite}@keyframes vr{to{transform:rotateY(360deg)}}
.fr2{border:4px solid;border-image:linear-gradient(135deg,#ffd700,#111 25%,#ffd700 50%,#111 75%,#ffd700) 1;box-shadow:0 0 16px #ffd700cc}.fr2::before,.fr2::after{content:"V";position:absolute;z-index:2;color:#ffd700;font:900 1.1em/1 system-ui;text-shadow:0 0 4px #000}.fr2::before{top:-1px;left:3px}.fr2::after{bottom:-1px;right:3px}
.bgi{background:linear-gradient(#000a,#000d),var(--img) center/cover no-repeat}
body{font-family:Rajdhani,'Segoe UI',system-ui,sans-serif;font-weight:600;letter-spacing:.02em;font-size:clamp(14px,1.5vw + 8px,17px);background:radial-gradient(ellipse at 50% 20%,#1e2a3d,#0a0e15 65%,#05070b)}
*{scrollbar-width:thin;scrollbar-color:#ffc400 #10141d}
::-webkit-scrollbar{width:6px;height:6px}::-webkit-scrollbar-thumb{background:#ffc400;border-radius:3px}::-webkit-scrollbar-track{background:#10141d}
button:not(.zb){font-family:inherit;font-weight:700;text-transform:uppercase;letter-spacing:.06em;color:#fff;background:linear-gradient(#46547a,#283049);border:0;border-radius:0;clip-path:polygon(9px 0,100% 0,calc(100% - 9px) 100%,0 100%);box-shadow:inset 0 -3px 0 #0007,inset 0 1px 0 #fff4;text-shadow:0 1px 0 #000a;transition:filter .12s,scale .08s}
button:not(.zb):hover{filter:brightness(1.18)}
button:not(.zb):active{scale:.96;filter:brightness(.9)}
button:not(.zb):disabled{filter:grayscale(1) brightness(.7);opacity:.5}
button.pr:not(.zb),button.on2:not(.zb){background:linear-gradient(#ffd83d,#ff8f00);color:#2b1600;text-shadow:0 1px 0 #fff7;box-shadow:inset 0 -4px 0 #b05a00,inset 0 1px 0 #fff9}
button.sb:not(.zb){clip-path:none;border:2px solid #7cff2a;border-radius:6px;background:rgba(150,30,20,.9);color:#e8ffd0;box-shadow:0 0 18px #3ddc1c}
#hud button,.ib button:not(.zb),.lbR button:not(.zb){clip-path:none;border-radius:10px;background:linear-gradient(#34405e,#1a2133);border:2px solid #6b7da6;box-shadow:0 2px 6px #000a,inset 0 1px 0 #fff3;font-size:20px}
.lbB .r button:not(.zb){clip-path:polygon(5px 0,100% 0,calc(100% - 5px) 100%,0 100%);padding:6px 6px}
